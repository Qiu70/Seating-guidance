<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>座位导航 · 左海产业生态大会</title>
    <style>
        :root {
            --card-max-width: 400px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .bg-fixed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('背景.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', system-ui, sans-serif;
            background-color: #3c1a6e;
            color: #f0eaff;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3vw;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .page {
            width: 100%;
            display: flex;
            justify-content: center;
            transition: opacity 0.35s ease;
        }
        .page.hidden {
            display: none !important;
        }
        .page.active {
            display: flex;
        }

        .glass-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4.5vw;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.18);
            padding: 5vw 4vw;
            text-align: center;
        }

        /* 首页 */
        .home-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 3vw;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.28);
        }
        .home-icon svg {
            width: 28px;
            height: 28px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .home-title {
            font-size: 5.2vw;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
            margin-bottom: 1.5vw;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        .home-subtitle {
            font-size: 3.4vw;
            color: rgba(255, 255, 255, 0.78);
            margin-bottom: 5.5vw;
        }
        .input-wrap {
            position: relative;
            margin-bottom: 2vw;
        }
        .input-wrap input {
            width: 100%;
            padding: 3.6vw 9vw 3.6vw 3.6vw;
            font-size: 3.8vw;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 10vw;
            outline: none;
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            text-align: center;
            letter-spacing: 0.5px;
            transition: background 0.2s, border-color 0.2s;
        }
        .input-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        .input-wrap input:focus {
            border-color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.24);
        }
        .input-icon {
            position: absolute;
            right: 3.5vw;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: rgba(255, 255, 255, 0.55);
            width: 4vw;
            height: 4vw;
        }
        .error-message {
            display: block;
            height: 4.5vw;
            line-height: 4.5vw;
            font-size: 3vw;
            color: #ffaaaa;
            margin-bottom: 2vw;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .error-message.show {
            opacity: 1;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 2vw;
            padding: 3.6vw 5vw;
            font-size: 4vw;
            font-weight: 600;
            border: none;
            border-radius: 10vw;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            outline: none;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            color: #5b21b6;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.14);
            touch-action: manipulation;
        }
        .btn:active {
            transform: scale(0.97);
            background: #fff;
        }
        .btn-outline-sm {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            width: auto;
            padding: 2vw 4vw;
            font-size: 3.2vw;
            border-radius: 8vw;
            box-shadow: none;
        }
        .home-hint {
            margin-top: 2.5vw;
            font-size: 2.8vw;
            color: rgba(255, 255, 255, 0.5);
        }

        /* 结果页 */
        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 3vw;
        }
        .result-greeting {
            font-size: 4.2vw;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }
        .result-greeting .name-em {
            color: #fff;
            font-weight: 800;
        }

        .seat-big-info {
            margin: 3vw 0;
            padding: 4vw 3.5vw;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3vw;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .seat-zone-display {
            display: inline-flex;
            align-items: center;
            gap: 2.5vw;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 8vw;
            padding: 2vw 4vw;
            margin-bottom: 2.5vw;
            border: 1px solid rgba(255, 255, 255, 0.22);
        }
        .zone-badge {
            width: 9vw;
            height: 9vw;
            max-width: 40px;
            max-height: 40px;
            border-radius: 50%;
            font-size: 4.5vw;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .zone-badge.front {
            background: #c98a3a;
        }
        .zone-badge.middle {
            background: #3b72b5;
        }
        .zone-badge.back {
            background: #4a9068;
        }
        .zone-text {
            font-size: 3.6vw;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            text-align: left;
        }
        .seat-detail-row {
            display: flex;
            flex-wrap: wrap;
            gap: 2.5vw;
            justify-content: center;
            align-items: center;
            margin: 1vw 0;
        }
        .seat-detail-item {
            font-size: 5.5vw;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }
        .seat-detail-divider {
            font-size: 3.5vw;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
        }
        .seat-code {
            font-size: 3.5vw;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.12);
            padding: 1.5vw 4vw;
            border-radius: 5vw;
            letter-spacing: 1px;
            margin-top: 1.5vw;
            display: inline-block;
        }

        /* 图片查看器 */
        .image-section {
            margin-top: 3vw;
        }
        .image-section-title {
            font-size: 3.6vw;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 2vw;
        }
        .image-viewer {
            width: 100%;
            background: rgba(20, 15, 35, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 3vw;
            overflow: hidden;
            position: relative;
            touch-action: none;
            cursor: grab;
        }
        .image-viewer:active {
            cursor: grabbing;
        }
        .image-viewer img {
            display: block;
            width: 100%;
            height: auto;
            transform-origin: 0 0;
            pointer-events: none;
        }

        .zoom-row {
            display: flex;
            gap: 2.5vw;
            justify-content: center;
            align-items: center;
            margin-top: 2.5vw;
        }
        .btn-ctrl {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 2vw 3.5vw;
            font-size: 3.2vw;
            border-radius: 6vw;
            cursor: pointer;
            font-weight: 600;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .btn-ctrl:active {
            background: rgba(255, 255, 255, 0.3);
        }
        .zoom-pct {
            color: rgba(255, 255, 255, 0.7);
            font-size: 3vw;
            min-width: 10vw;
            text-align: center;
        }
        .zoom-hint {
            text-align: center;
            font-size: 2.4vw;
            color: rgba(255, 255, 255, 0.45);
            margin-top: 1.5vw;
        }

        @media (max-width: 360px) {
            .home-title {
                font-size: 5.8vw;
            }
            .home-subtitle {
                font-size: 3.8vw;
            }
            .input-wrap input {
                padding: 4vw 11vw 4vw 4vw;
                font-size: 4vw;
            }
            .btn {
                padding: 4vw 6vw;
                font-size: 4.2vw;
            }
            .seat-detail-item {
                font-size: 6vw;
            }
            .btn-ctrl {
                padding: 2.5vw 4vw;
                font-size: 3.5vw;
            }
        }
        @media (min-width: 420px) {
            .glass-card {
                border-radius: 18px;
                padding: 24px 20px;
            }
            .home-title {
                font-size: 1.25rem;
            }
            .home-subtitle {
                font-size: 0.8rem;
            }
            .input-wrap input {
                padding: 13px 38px 13px 14px;
                font-size: 0.88rem;
            }
            .btn {
                padding: 13px 24px;
                font-size: 0.88rem;
            }
            .seat-detail-item {
                font-size: 1.35rem;
            }
            .zone-text {
                font-size: 0.82rem;
            }
            .error-message {
                height: 18px;
                line-height: 18px;
                font-size: 0.68rem;
            }
            .btn-ctrl {
                padding: 8px 14px;
                font-size: 0.8rem;
                border-radius: 20px;
            }
            .zoom-pct {
                font-size: 0.78rem;
            }
            .zoom-hint {
                font-size: 0.65rem;
            }
            .image-section-title {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-fixed"></div>

    <div class="app-container">
        <!-- 首页 -->
        <div class="page active" id="page-home">
            <div class="glass-card">
                <div class="home-icon">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="5" width="18" height="2.5" rx="1" />
                        <rect x="5.5" y="10" width="3.5" height="3.5" rx="0.8" />
                        <rect x="11" y="10" width="3.5" height="3.5" rx="0.8" />
                        <rect x="16.5" y="10" width="3.5" height="3.5" rx="0.8" />
                        <rect x="5.5" y="16" width="3.5" height="3.5" rx="0.8" />
                        <rect x="11" y="16" width="5" height="3.5" rx="0.8" fill="currentColor" stroke="none" opacity="0.35" />
                        <circle cx="13.5" cy="17.75" r="1" fill="#fff" />
                    </svg>
                </div>
                <h1 class="home-title">座位导航</h1>
                <p class="home-subtitle">输入姓名，查看您的座位</p>
                <div class="input-wrap">
                    <input type="text" id="nameInput" placeholder="请输入姓名" autocomplete="name" maxlength="30">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="8" r="4" /><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2" />
                    </svg>
                </div>
                <span class="error-message" id="errorMessage">请输入姓名</span>
                <button class="btn" id="btnFindSeat" type="button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:4vw;height:4vw;">
                        <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    查找座位
                </button>
                <p class="home-hint">试试输入"张三"或"李小明"</p>
            </div>
        </div>

        <!-- 结果页 -->
        <div class="page hidden" id="page-result">
            <div class="glass-card">
                <div class="result-header">
                    <div class="result-greeting">👋 <span class="name-em" id="displayName">---</span> 的座位</div>
                    <button class="btn btn-outline-sm" id="btnBack" type="button">← 返回</button>
                </div>

                <div class="seat-big-info" id="seatBigInfo"></div>

                <!-- 高清座位图 -->
                <div class="image-section">
                    <div class="image-section-title">会场座位示意图</div>
                    <div class="image-viewer" id="imageViewer">
                        <!-- 替换 src 为你的高清座位图地址 -->
                        <img id="seatImage" src="座位示意图.png" alt="会场座位示意图">
                    </div>
                    <div class="zoom-row">
                        <button class="btn-ctrl" id="zoomOutBtn" type="button">−</button>
                        <span class="zoom-pct" id="zoomPct">100%</span>
                        <button class="btn-ctrl" id="zoomInBtn" type="button">+</button>
                        <button class="btn-ctrl" id="zoomResetBtn" type="button">↺</button>
                    </div>
                    <p class="zoom-hint">👆 双指缩放 · 单指拖动查看细节</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const pageHome = document.getElementById('page-home');
            const pageResult = document.getElementById('page-result');
            const nameInput = document.getElementById('nameInput');
            const btnFindSeat = document.getElementById('btnFindSeat');
            const btnBack = document.getElementById('btnBack');
            const displayName = document.getElementById('displayName');
            const seatBigInfo = document.getElementById('seatBigInfo');
            const errorMessage = document.getElementById('errorMessage');

            const imageViewer = document.getElementById('imageViewer');
            const seatImage = document.getElementById('seatImage');
            const zoomPct = document.getElementById('zoomPct');

            // 座位数据
            const allSeats = [];
            for (let row = 1; row <= 13; row++) {
                let section = row <= 4 ? 'front' : row <= 9 ? 'middle' : 'back';
                for (let seat = 1; seat <= 10; seat++) {
                    allSeats.push({ zoneLetter: 'A', row, seat, section, code: `A${row}-${seat}` });
                    allSeats.push({ zoneLetter: 'B', row, seat, section, code: `B${row}-${seat}` });
                }
            }

            function hashString(str) {
                let h = 5381;
                for (let i = 0; i < str.length; i++) h = ((h << 5) + h) + str.charCodeAt(i) & 0x7fffffff;
                return h;
            }

            function getSeatByName(name) {
                const t = name.trim();
                if (!t) return null;
                return allSeats[hashString(t) % allSeats.length];
            }

            // 图片缩放
            let scale = 1,
                offX = 0,
                offY = 0;
            const MIN_S = 0.5,
                MAX_S = 5;
            let lastPinch = 0,
                lastTx = 0,
                lastTy = 0,
                dragging = false;

            function updateImg() {
                seatImage.style.transform = `translate(${offX}px, ${offY}px) scale(${scale})`;
                zoomPct.textContent = Math.round(scale * 100) + '%';
            }

            function resetImg() { scale = 1;
                offX = 0;
                offY = 0;
                updateImg(); }

            function pinchDist(t1, t2) { return Math.sqrt((t1.clientX - t2.clientX) ** 2 + (t1.clientY - t2.clientY) **
                2); }

            imageViewer.addEventListener('touchstart', function(e) {
                if (e.touches.length === 2) { dragging = false;
                    lastPinch = pinchDist(e.touches[0], e.touches[1]); } else if (e.touches.length === 1) { dragging =
                        true;
                    lastTx = e.touches[0].clientX;
                    lastTy = e.touches[0].clientY; }
            }, { passive: false });

            imageViewer.addEventListener('touchmove', function(e) {
                e.preventDefault();
                if (e.touches.length === 2) {
                    dragging = false;
                    const nd = pinchDist(e.touches[0], e.touches[1]);
                    const rect = imageViewer.getBoundingClientRect();
                    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
                    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
                    if (lastPinch > 0) {
                        const r = nd / lastPinch;
                        const ns = Math.min(MAX_S, Math.max(MIN_S, scale * r));
                        offX = cx - (cx - offX) * (ns / scale);
                        offY = cy - (cy - offY) * (ns / scale);
                        scale = ns;
                        updateImg();
                    }
                    lastPinch = nd;
                } else if (e.touches.length === 1 && dragging) {
                    offX += e.touches[0].clientX - lastTx;
                    offY += e.touches[0].clientY - lastTy;
                    lastTx = e.touches[0].clientX;
                    lastTy = e.touches[0].clientY;
                    updateImg();
                }
            }, { passive: false });

            imageViewer.addEventListener('touchend', function(e) { if (e.touches.length === 0) { dragging = false;
                    lastPinch = 0; } });

            imageViewer.addEventListener('wheel', function(e) {
                e.preventDefault();
                const rect = imageViewer.getBoundingClientRect();
                const mx = e.clientX - rect.left,
                    my = e.clientY - rect.top;
                const ns = Math.min(MAX_S, Math.max(MIN_S, scale * (e.deltaY > 0 ? 0.9 : 1.1)));
                offX = mx - (mx - offX) * (ns / scale);
                offY = my - (my - offY) * (ns / scale);
                scale = ns;
                updateImg();
            }, { passive: false });

            document.getElementById('zoomInBtn').addEventListener('click', () => {
                const ns = Math.min(MAX_S, scale * 1.35);
                const dw = imageViewer.clientWidth,
                    dh = imageViewer.clientHeight;
                offX = dw / 2 - (dw / 2 - offX) * (ns / scale);
                offY = dh / 2 - (dh / 2 - offY) * (ns / scale);
                scale = ns;
                updateImg();
            });
            document.getElementById('zoomOutBtn').addEventListener('click', () => {
                const ns = Math.max(MIN_S, scale / 1.35);
                const dw = imageViewer.clientWidth,
                    dh = imageViewer.clientHeight;
                offX = dw / 2 - (dw / 2 - offX) * (ns / scale);
                offY = dh / 2 - (dh / 2 - offY) * (ns / scale);
                scale = ns;
                updateImg();
            });
            document.getElementById('zoomResetBtn').addEventListener('click', resetImg);

            // UI
            function buildBigInfoHTML(seat) {
                const sc = seat.section;
                const st = sc === 'front' ? '前排' : sc === 'middle' ? '中排' : '后排';
                return `
                    <div class="seat-zone-display"><span class="zone-badge ${sc}">${seat.zoneLetter}</span><span class="zone-text">${seat.zoneLetter}区 · ${st}</span></div>
                    <div class="seat-detail-row"><span class="seat-detail-item">第 ${seat.row} 排</span><span class="seat-detail-divider">·</span><span class="seat-detail-item">第 ${seat.seat} 座</span></div>
                    <span class="seat-code">🏷️ 编号：${seat.code}</span>`;
            }

            function showError(msg) {
                errorMessage.textContent = msg;
                errorMessage.classList.add('show');
                nameInput.style.borderColor = 'rgba(255,138,138,0.9)';
                setTimeout(() => { errorMessage.classList.remove('show');
                    nameInput.style.borderColor = 'rgba(255,255,255,0.35)'; }, 2000);
            }

            function showPage(p) { [pageHome, pageResult].forEach(x => x.classList.add('hidden'));
                p.classList.remove('hidden'); }

            function showResult(name, seat) {
                displayName.textContent = name.trim();
                seatBigInfo.innerHTML = buildBigInfoHTML(seat);
                showPage(pageResult);
                resetImg();
                const url = new URL(window.location);
                url.searchParams.set('name', name.trim());
                history.pushState(null, '', url.toString());
                pageResult.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            btnFindSeat.addEventListener('click', () => {
                const name = nameInput.value.trim();
                if (!name) { showError('请输入姓名'); return; }
                const seat = getSeatByName(name);
                if (!seat) { showError('未找到对应座位，请重试'); return; }
                showResult(name, seat);
            });
            nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault();
                    btnFindSeat.click(); } });
            btnBack.addEventListener('click', () => { showPage(pageHome);
                nameInput.focus(); if (window.location.search.includes('name=')) history.pushState(null, '',
                    window.location.pathname); });

            window.addEventListener('popstate', () => {
                const p = new URLSearchParams(window.location.search);
                const nm = p.get('name');
                if (nm && nm.trim()) { const seat = getSeatByName(nm); if (seat) { showResult(nm, seat); return; } }
                showPage(pageHome);
                nameInput.focus();
            });

            function init() {
                const p = new URLSearchParams(window.location.search);
                const nm = p.get('name');
                if (nm && nm.trim()) { const seat = getSeatByName(nm); if (seat) { showResult(nm, seat); return; } }
                showPage(pageHome);
                nameInput.focus();
            }
            init();
        })();
    </script>
</body>
</html>
