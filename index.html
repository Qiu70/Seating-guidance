<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>签到座位导航 · 左海产业生态大会</title>
    <style>
        :root { --card-max-width: 420px; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        .bg-fixed {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('背景.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat; z-index: -2;
        }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
            background-color: #3c1a6e; color: #f0eaff; min-height: 100vh; min-height: -webkit-fill-available;
            display: flex; align-items: center; justify-content: center; padding: 2vw; overflow-x: hidden;
            -webkit-user-select: none; user-select: none;
        }
        .app-container { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; }
        .page { width: 100%; display: flex; justify-content: center; transition: opacity 0.35s ease; }
        .page.hidden { display: none !important; }
        .page.active { display: flex; }
        .glass-card {
            width: 100%; background: rgba(255,255,255,0.2); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255,255,255,0.3); border-radius: 4vw; box-shadow: 0 10px 40px rgba(0,0,0,0.18);
            padding: 5vw 4vw; text-align: center; display: flex; flex-direction: column;
        }
        .checkin-banner {
            background: linear-gradient(135deg, rgba(74,222,128,0.3) 0%, rgba(34,197,94,0.2) 100%);
            border: 1px solid rgba(74,222,128,0.5); border-radius: 3vw; padding: 3vw 4vw;
            margin-bottom: 3vw; display: flex; align-items: center; justify-content: center; gap: 2vw;
            animation: checkinPulse 2s ease-in-out infinite;
        }
        @keyframes checkinPulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(74,222,128,0.4); }
            50% { box-shadow: 0 0 0 12px rgba(74,222,128,0); }
        }
        .checkin-icon {
            width: 10vw; height: 10vw; max-width: 42px; max-height: 42px;
            background: rgba(74,222,128,0.4); border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-size: 6vw;
        }
        .checkin-text { font-size: 4.5vw; font-weight: 700; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        .checkin-sub { font-size: 3vw; color: rgba(255,255,255,0.8); margin-top: 0.5vw; }

        .home-icon {
            width: 52px; height: 52px; margin: 0 auto 3vw; background: rgba(255,255,255,0.18); border-radius: 15px;
            display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.28);
        }
        .home-icon svg { width: 28px; height: 28px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .home-title { font-size: 5.5vw; font-weight: 700; color: #fff; margin-bottom: 1.5vw; letter-spacing: 0.5px; }
        .home-subtitle { font-size: 3.4vw; color: rgba(255,255,255,0.78); margin-bottom: 5.5vw; }
        .input-wrap { position: relative; margin-bottom: 1.5vw; }
        .input-wrap input {
            width: 100%; padding: 3.6vw 9vw 3.6vw 3.6vw; font-size: 3.8vw; border: 2px solid rgba(255,255,255,0.35);
            border-radius: 10vw; outline: none; background: rgba(255,255,255,0.14); color: #fff; text-align: center;
            transition: background 0.2s, border-color 0.2s;
        }
        .input-wrap input::placeholder { color: rgba(255,255,255,0.5); }
        .input-wrap input:focus { border-color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.24); }
        .input-icon {
            position: absolute; right: 3.5vw; top: 50%; transform: translateY(-50%); pointer-events: none;
            color: rgba(255,255,255,0.55); width: 4vw; height: 4vw;
        }
        .error-message { display: block; height: 4.5vw; line-height: 4.5vw; font-size: 3vw; color: #ffaaaa; margin-bottom: 1.5vw; opacity: 0; transition: opacity 0.2s; }
        .error-message.show { opacity: 1; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; padding: 3.6vw 5vw; font-size: 4vw;
            font-weight: 600; border: none; border-radius: 10vw; cursor: pointer; width: 100%;
            background: rgba(255,255,255,0.9); color: #5b21b6; box-shadow: 0 4px 16px rgba(0,0,0,0.14);
        }
        .btn:active { transform: scale(0.97); }
        .btn-outline-sm {
            background: rgba(255,255,255,0.15); color: #fff; border: 1.5px solid rgba(255,255,255,0.4);
            width: auto; padding: 2.2vw 4vw; font-size: 3.2vw; border-radius: 8vw; box-shadow: none;
        }

        .result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2vw; }
        .result-greeting { font-size: 4.2vw; font-weight: 600; color: rgba(255,255,255,0.9); text-align: left; }
        .result-greeting .name-em { color: #fff; font-weight: 800; }

        .seat-result-card {
            margin: 2vw 0; padding: 3vw; background: rgba(255,255,255,0.12);
            border-radius: 3vw; border: 1px solid rgba(255,255,255,0.22); text-align: center;
        }
        .seat-info-box {
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
            border-radius: 3vw; padding: 3vw 4vw; text-align: center;
        }
        .seat-code-big { font-size: 6vw; font-weight: 800; color: #fff; }
        .seat-detail { font-size: 3.6vw; color: rgba(255,255,255,0.8); margin-top: 1.5vw; }

        @media (max-width: 360px) {
            .home-title { font-size: 5.8vw; }
            .checkin-text { font-size: 5vw; }
        }
        @media (min-width: 420px) {
            .glass-card { border-radius: 18px; padding: 24px 20px; }
            .home-title { font-size: 1.3rem; } .home-subtitle { font-size: 0.82rem; }
            .input-wrap input { padding: 14px 38px 14px 14px; font-size: 0.9rem; }
            .btn { padding: 14px 24px; font-size: 0.9rem; }
            .error-message { height: 18px; line-height: 18px; font-size: 0.7rem; }
            .checkin-text { font-size: 1.1rem; } .checkin-sub { font-size: 0.75rem; }
            .seat-code-big { font-size: 1.5rem; }
            .seat-detail { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
<div class="bg-fixed"></div>
<div class="app-container">
    <div class="page active" id="page-home">
        <div class="glass-card">
            <div class="home-icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="2.5" rx="1"/><rect x="5.5" y="10" width="3.5" height="3.5" rx="0.8"/><rect x="11" y="10" width="3.5" height="3.5" rx="0.8"/><rect x="16.5" y="10" width="3.5" height="3.5" rx="0.8"/><rect x="5.5" y="16" width="3.5" height="3.5" rx="0.8"/><rect x="11" y="16" width="5" height="3.5" rx="0.8" fill="currentColor" stroke="none" opacity="0.35"/><circle cx="13.5" cy="17.75" r="1" fill="#fff"/></svg></div>
            <h1 class="home-title">座位导航</h1>
            <p class="home-subtitle">输入完整姓名，查看座位</p>
            <div class="input-wrap">
                <input type="text" id="nameInput" placeholder="请输入完整的姓名" autocomplete="off" maxlength="30">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>
            </div>
            <span class="error-message" id="errorMessage">请输入正确的姓名</span>
            <button class="btn" id="btnFindSeat" type="button">查找座位</button>
        </div>
    </div>

    <div class="page hidden" id="page-result">
        <div class="glass-card">
            <div class="checkin-banner">
                <div class="checkin-icon">✓</div>
                <div>
                    <div class="checkin-text">签到成功</div>
                    <div class="checkin-sub">欢迎参加左海产业生态大会</div>
                </div>
            </div>
            <div class="result-header">
                <div class="result-greeting" id="resultGreeting"></div>
                <button class="btn btn-outline-sm" id="btnBack" type="button">← 返回</button>
            </div>
            <div class="seat-result-card" id="seatResultCard"></div>
        </div>
    </div>
</div>

<script>
(function() {
    // ==================== 姓名 → 座位编号（按最新排座表） ====================
    const nameToSeats = {};

    function add(name, code) {
        if (!name) return;
        const n = name.trim();
        if (!n) return;
        if (!nameToSeats[n]) nameToSeats[n] = [];
        nameToSeats[n].push(code);
    }

    // 第1排
    add("项凤华", "A1-1"); add("黄为民", "A1-2"); add("祁麟", "A1-3"); add("辛军飞", "A1-4");
    add("卢文晶", "A1-5"); add("陈圣焜", "A1-6"); add("林贤华", "A1-7"); add("陈明东", "A1-8");
    add("杨学敏", "A1-9"); add("黄正洪", "A1-10");
    add("严梅明", "B1-1"); add("熊培惠", "B1-2"); add("高远忠", "B1-3"); add("陈颖", "B1-4");
    add("林金泉", "B1-5"); add("查恩尧", "B1-6"); add("刘芳", "B1-7"); add("赵鑫旸", "B1-8");
    add("林善和", "B1-9"); add("李亚亚", "B1-10");

    // 第2排
    add("胡九龙", "A2-1"); add("黄福祥", "A2-2"); add("鲍光海", "A2-3"); add("黄萍", "A2-4");
    add("罗堪", "A2-5"); add("王丹琼", "A2-6"); add("陈芳", "A2-7"); add("陈学农", "A2-8");
    add("念保镖", "A2-9"); add("黄照琴", "A2-10");
    add("陈昆", "B2-1"); add("李硕", "B2-2"); add("郑清廉", "B2-3"); add("张权勋", "B2-4");
    add("邹慧云", "B2-5"); add("龚凉红", "B2-6"); add("宋鹏军", "B2-7"); add("曹而超", "B2-8");
    add("卢米高", "B2-9"); add("邱小琴", "B2-10");

    // 第3排
    add("翁磊", "A3-1"); add("骆华涛", "A3-2"); add("陈麦麟", "A3-3"); add("吴红洲", "A3-4");
    add("黄敬春", "A3-5"); add("李向红", "A3-6"); add("毕超", "A3-7"); add("张翼", "A3-8");
    add("董川", "A3-9"); add("谢风光", "A3-10");
    add("王长琛", "B3-1"); add("赖志艺", "B3-2"); add("陈勇庆", "B3-3"); add("李琦山", "B3-4");
    add("胡晓东", "B3-5"); add("吴小付", "B3-6"); add("张会东", "B3-7"); add("李殿魁", "B3-8");
    add("卞晓丽", "B3-9"); add("李元杰", "B3-10");

    // 第4排
    add("郑和", "A4-1"); add("陈晓春", "A4-2"); add("童正群", "A4-3"); add("林而庄", "A4-4");
    add("林超", "A4-5"); add("连若裴", "A4-6"); add("吴瑞敏", "A4-7"); add("余俊乐", "A4-8");
    add("钱磊", "A4-9"); add("谢威", "A4-10");
    add("苏天耀", "B4-1"); add("徐道煌", "B4-2"); add("熊凯宏", "B4-3"); add("蒋小军", "B4-4");
    add("潘守彬", "B4-5"); add("陈启", "B4-6"); add("何潇", "B4-7"); add("吴秀清", "B4-8");
    add("唐睿", "B4-9"); add("黄磊", "B4-10");

    // 第5排
    add("范祖洪", "A5-1"); add("张为东", "A5-2"); add("罗惠文", "A5-3"); add("黄黎明", "A5-4");
    add("陈宁", "A5-5"); add("阳成虎", "A5-6"); add("廖熙阳", "A5-7"); add("林晞睿", "A5-8");
    add("张利剑", "A5-10"); add("吴景红", "A5-11"); add("林建军", "A5-12"); add("钱媛", "A5-13");
    add("胡海明", "A5-14"); add("陆观立", "A5-15");
    add("李宣霈", "B5-1");

    // 第6排
    add("郑晨行", "A6-1"); add("吕杨", "A6-2"); add("鄢仁武", "A6-3"); add("陈世光", "A6-4");
    add("牛畅", "A6-5"); add("蔡浩威", "A6-7"); add("严璇", "A6-8"); add("赵素雅", "A6-9");
    add("魏剑斌", "A6-10"); add("黄桦", "A6-11"); add("刘伟", "A6-12"); add("丁光振", "A6-13");
    add("陈宗燕", "A6-14"); add("黄勤登", "A6-15");
    add("朱爱虹", "B6-1"); add("黄山", "B6-2"); add("林智斌", "B6-3"); add("程文钊", "B6-4");
    add("邱宏彬", "B6-5");

    // 第7排
    add("邓莉", "A7-1"); add("郭晓光", "A7-2"); add("邓一雄", "A7-3"); add("陈历历", "A7-4");
    add("李渝", "A7-5");

    // 第10排
    add("林心舒", "A10-1"); add("张霞", "A10-2"); add("邱文真", "A10-3"); add("陈洋", "A10-4");
    add("沈磊", "A10-5"); add("毛丽华", "A10-6"); add("徐闻铭", "A10-7"); add("曾盘高", "A10-8");
    add("陈兆宝", "A10-9"); add("罗长裕", "A10-10"); add("赵雷", "A10-11"); add("林妮娜", "A10-12");
    add("何文馨", "A10-13"); add("卢金华", "A10-14"); add("钟辉", "A10-15");
    add("孙宏伟", "B10-1"); add("郭文新", "B10-2"); add("吴伟", "B10-3"); add("胡勇强", "B10-4");
    add("黄光海", "B10-5"); add("王静", "B10-6"); add("蔡宗荣", "B10-7"); add("程隽", "B10-8");
    add("唐凌凡", "B10-9"); add("王小庄", "B10-10"); add("房祥凯", "B10-11"); add("胡达明", "B10-12");
    add("孙明春", "B10-13"); add("陈有章", "B10-14"); add("虞志轩", "B10-15");

    // 第11排
    add("朱佑健", "A11-1"); add("张礼", "A11-2"); add("林彬龙", "A11-3"); add("沈晓芝", "A11-4");
    add("林文杰", "A11-5");

    function parseSeatCode(code) {
        const match = code.match(/^([AB])(\d+)-(\d+)$/);
        if (!match) return null;
        const row = parseInt(match[2]);
        return { zone: match[1], row: row, seat: parseInt(match[3]), section: row <= 4 ? '前排' : row <= 9 ? '中排' : '后排' };
    }

    // 精确查找
    function findSeatByNameExact(name) {
        const trimmed = name.trim();
        if (!trimmed) return null;
        if (!nameToSeats.hasOwnProperty(trimmed)) return null;
        const codes = nameToSeats[trimmed];
        const parsed = codes.map(c => ({ code: c, info: parseSeatCode(c) })).filter(x => x.info);
        if (parsed.length === 0) return null;
        parsed.sort((a, b) => a.info.row - b.info.row || a.info.seat - b.info.seat);
        return { name: trimmed, seats: parsed, count: parsed.length };
    }

    // DOM
    const pageHome = document.getElementById('page-home');
    const pageResult = document.getElementById('page-result');
    const nameInput = document.getElementById('nameInput');
    const btnFindSeat = document.getElementById('btnFindSeat');
    const btnBack = document.getElementById('btnBack');
    const resultGreeting = document.getElementById('resultGreeting');
    const seatResultCard = document.getElementById('seatResultCard');
    const errorMessage = document.getElementById('errorMessage');

    function showError(msg) {
        errorMessage.textContent = msg;
        errorMessage.classList.add('show');
        setTimeout(() => errorMessage.classList.remove('show'), 2500);
    }
    function showPage(p) { [pageHome, pageResult].forEach(x => x.classList.add('hidden')); p.classList.remove('hidden'); }

    function showResult(data) {
        resultGreeting.innerHTML = `👋 <span class="name-em">${data.name}</span> 的座位`;
        let html = '';
        data.seats.forEach(s => {
            const { zone, row, seat, section } = s.info;
            html += `
                <div class="seat-info-box">
                    <div class="seat-code-big">${s.code}</div>
                    <div class="seat-detail">${zone}区 ${section} 第${row}排 第${seat}座</div>
                </div>
                <div style="height:2vw;"></div>
            `;
        });
        seatResultCard.innerHTML = html;
        showPage(pageResult);
        pageResult.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function doSearch() {
        const input = nameInput.value;
        const result = findSeatByNameExact(input);
        if (!result) {
            showError('未找到该姓名，请检查是否输入完整姓名');
            return;
        }
        showResult(result);
    }

    btnFindSeat.addEventListener('click', doSearch);
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });
    btnBack.addEventListener('click', () => { showPage(pageHome); nameInput.focus(); });

    // 扫码参数支持 ?name=完整姓名
    function init() {
        const params = new URLSearchParams(window.location.search);
        const nameParam = params.get('name');
        if (nameParam && nameParam.trim()) {
            const result = findSeatByNameExact(nameParam.trim());
            if (result) {
                showResult(result);
                return;
            }
        }
        showPage(pageHome);
        nameInput.focus();
    }
    init();
})();
</script>
</body>
</html>
