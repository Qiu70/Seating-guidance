<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>座位导航 · 左海产业生态大会</title>
    <style>
        :root {
            --card-max-width: 400px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .bg-fixed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('背景.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', system-ui, sans-serif;
            background-color: #3c1a6e;
            color: #f0eaff;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3vw;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .page {
            width: 100%;
            display: flex;
            justify-content: center;
            transition: opacity 0.35s ease;
        }
        .page.hidden {
            display: none !important;
        }
        .page.active {
            display: flex;
        }

        /* 毛玻璃卡片 */
        .glass-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4.5vw;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.18);
            padding: 5vw 4vw;
            text-align: center;
        }

        /* 首页 */
        .home-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 3vw;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.28);
        }
        .home-icon svg {
            width: 28px;
            height: 28px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .home-title {
            font-size: 5.2vw;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
            margin-bottom: 1.5vw;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        .home-subtitle {
            font-size: 3.4vw;
            color: rgba(255, 255, 255, 0.78);
            margin-bottom: 5.5vw;
        }
        .input-wrap {
            position: relative;
            margin-bottom: 2vw;
        }
        .input-wrap input {
            width: 100%;
            padding: 3.6vw 9vw 3.6vw 3.6vw;
            font-size: 3.8vw;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 10vw;
            outline: none;
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            text-align: center;
            letter-spacing: 0.5px;
            transition: background 0.2s, border-color 0.2s;
        }
        .input-wrap input::placeholder { color: rgba(255, 255, 255, 0.5); }
        .input-wrap input:focus {
            border-color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.24);
        }
        .input-icon {
            position: absolute;
            right: 3.5vw;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: rgba(255, 255, 255, 0.55);
            width: 4vw;
            height: 4vw;
        }
        .error-message {
            display: block;
            height: 4.5vw;
            line-height: 4.5vw;
            font-size: 3vw;
            color: #ffaaaa;
            margin-bottom: 2vw;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .error-message.show { opacity: 1; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 2vw;
            padding: 3.6vw 5vw;
            font-size: 4vw;
            font-weight: 600;
            border: none;
            border-radius: 10vw;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            outline: none;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            color: #5b21b6;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.14);
            touch-action: manipulation;
        }
        .btn:active { transform: scale(0.97); background: #fff; }
        .btn-outline-sm {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            width: auto;
            padding: 2vw 4vw;
            font-size: 3.2vw;
            border-radius: 8vw;
            box-shadow: none;
        }
        .home-hint {
            margin-top: 2.5vw;
            font-size: 2.8vw;
            color: rgba(255, 255, 255, 0.5);
        }

        /* 结果页 */
        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 3vw;
        }
        .result-greeting {
            font-size: 4.2vw;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }
        .result-greeting .name-em { color: #fff; font-weight: 800; }

        .seat-big-info {
            margin: 3vw 0;
            padding: 4vw 3.5vw;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3vw;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .seat-zone-display {
            display: inline-flex;
            align-items: center;
            gap: 2.5vw;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 8vw;
            padding: 2vw 4vw;
            margin-bottom: 2.5vw;
            border: 1px solid rgba(255, 255, 255, 0.22);
        }
        .zone-badge {
            width: 9vw;
            height: 9vw;
            max-width: 40px;
            max-height: 40px;
            border-radius: 50%;
            font-size: 4.5vw;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .zone-badge.front { background: #c98a3a; }
        .zone-badge.middle { background: #3b72b5; }
        .zone-badge.back { background: #4a9068; }
        .zone-text {
            font-size: 3.6vw;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            text-align: left;
        }
        .seat-detail-row {
            display: flex;
            flex-wrap: wrap;
            gap: 2.5vw;
            justify-content: center;
            align-items: center;
            margin: 1vw 0;
        }
        .seat-detail-item {
            font-size: 5.5vw;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }
        .seat-detail-divider {
            font-size: 3.5vw;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
        }
        .seat-code {
            font-size: 3.5vw;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.12);
            padding: 1.5vw 4vw;
            border-radius: 5vw;
            letter-spacing: 1px;
            margin-top: 1.5vw;
            display: inline-block;
        }

        /* Canvas 毛玻璃容器 */
        .canvas-section {
            margin-top: 3vw;
        }
        .canvas-section-title {
            font-size: 3.6vw;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 2vw;
        }
        .canvas-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 3vw;
            overflow: hidden;
            position: relative;
            touch-action: none;
        }
        .canvas-card canvas {
            display: block;
            width: 100%;
            height: auto;
            transform-origin: 0 0;
        }

        /* 缩放控制 */
        .zoom-row {
            display: flex;
            gap: 2.5vw;
            justify-content: center;
            align-items: center;
            margin-top: 2.5vw;
        }
        .btn-ctrl {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 2vw 3.5vw;
            font-size: 3.2vw;
            border-radius: 6vw;
            cursor: pointer;
            font-weight: 600;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .btn-ctrl:active { background: rgba(255, 255, 255, 0.3); }
        .zoom-pct {
            color: rgba(255, 255, 255, 0.7);
            font-size: 3vw;
            min-width: 10vw;
            text-align: center;
        }
        .zoom-hint {
            text-align: center;
            font-size: 2.4vw;
            color: rgba(255, 255, 255, 0.45);
            margin-top: 1.5vw;
        }

        /* 图例 */
        .legend-row {
            display: flex;
            flex-wrap: wrap;
            gap: 2.5vw;
            justify-content: center;
            font-size: 2.6vw;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 2vw;
        }
        .legend-dot {
            display: inline-block;
            width: 2.8vw;
            height: 2.8vw;
            border-radius: 4px;
            margin-right: 1vw;
            vertical-align: middle;
        }
        .legend-dot.front-c { background: #e8cfa0; }
        .legend-dot.middle-c { background: #a8c8e8; }
        .legend-dot.back-c { background: #a8d4b8; }
        .legend-dot.your-c { background: #e8455b; border: 2px solid #c0392b; }

        @media (max-width: 360px) {
            .home-title { font-size: 5.8vw; }
            .home-subtitle { font-size: 3.8vw; }
            .input-wrap input { padding: 4vw 11vw 4vw 4vw; font-size: 4vw; }
            .btn { padding: 4vw 6vw; font-size: 4.2vw; }
            .seat-detail-item { font-size: 6vw; }
            .btn-ctrl { padding: 2.5vw 4vw; font-size: 3.5vw; }
        }
        @media (min-width: 420px) {
            .glass-card { border-radius: 18px; padding: 24px 20px; }
            .home-title { font-size: 1.25rem; }
            .home-subtitle { font-size: 0.8rem; }
            .input-wrap input { padding: 13px 38px 13px 14px; font-size: 0.88rem; }
            .btn { padding: 13px 24px; font-size: 0.88rem; }
            .seat-detail-item { font-size: 1.35rem; }
            .zone-text { font-size: 0.82rem; }
            .error-message { height: 18px; line-height: 18px; font-size: 0.68rem; }
            .btn-ctrl { padding: 8px 14px; font-size: 0.8rem; border-radius: 20px; }
            .zoom-pct { font-size: 0.78rem; }
            .zoom-hint { font-size: 0.65rem; }
            .legend-row { font-size: 0.7rem; gap: 10px; }
            .legend-dot { width: 10px; height: 10px; }
            .canvas-section-title { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="bg-fixed"></div>

    <div class="app-container">
        <!-- 首页 -->
        <div class="page active" id="page-home">
            <div class="glass-card">
                <div class="home-icon">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="5" width="18" height="2.5" rx="1" />
                        <rect x="5.5" y="10" width="3.5" height="3.5" rx="0.8" />
                        <rect x="11" y="10" width="3.5" height="3.5" rx="0.8" />
                        <rect x="16.5" y="10" width="3.5" height="3.5" rx="0.8" />
                        <rect x="5.5" y="16" width="3.5" height="3.5" rx="0.8" />
                        <rect x="11" y="16" width="5" height="3.5" rx="0.8" fill="currentColor" stroke="none" opacity="0.35" />
                        <circle cx="13.5" cy="17.75" r="1" fill="#fff" />
                    </svg>
                </div>
                <h1 class="home-title">座位导航</h1>
                <p class="home-subtitle">输入姓名，查看您的座位</p>
                <div class="input-wrap">
                    <input type="text" id="nameInput" placeholder="请输入姓名" autocomplete="name" maxlength="30">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="8" r="4" /><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2" />
                    </svg>
                </div>
                <span class="error-message" id="errorMessage">请输入姓名</span>
                <button class="btn" id="btnFindSeat" type="button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:4vw;height:4vw;">
                        <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    查找座位
                </button>
                <p class="home-hint">试试输入"张三"或"李小明"</p>
            </div>
        </div>

        <!-- 结果页 -->
        <div class="page hidden" id="page-result">
            <div class="glass-card">
                <div class="result-header">
                    <div class="result-greeting">👋 <span class="name-em" id="displayName">---</span> 的座位</div>
                    <button class="btn btn-outline-sm" id="btnBack" type="button">← 返回</button>
                </div>

                <div class="seat-big-info" id="seatBigInfo"></div>

                <!-- Canvas 座位示意图 -->
                <div class="canvas-section">
                    <div class="canvas-section-title">🏛️ 会场座位示意图</div>
                    <div class="canvas-card" id="canvasCard">
                        <canvas id="seatCanvas"></canvas>
                    </div>
                    <div class="zoom-row">
                        <button class="btn-ctrl" id="zoomOutBtn" type="button">−</button>
                        <span class="zoom-pct" id="zoomPct">100%</span>
                        <button class="btn-ctrl" id="zoomInBtn" type="button">+</button>
                        <button class="btn-ctrl" id="zoomResetBtn" type="button">↺</button>
                    </div>
                    <p class="zoom-hint">👆 双指缩放 · 单指拖动</p>
                    <div class="legend-row">
                        <span><span class="legend-dot front-c"></span>前排</span>
                        <span><span class="legend-dot middle-c"></span>中排</span>
                        <span><span class="legend-dot back-c"></span>后排</span>
                        <span><span class="legend-dot your-c"></span>您的座位</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const pageHome = document.getElementById('page-home');
            const pageResult = document.getElementById('page-result');
            const nameInput = document.getElementById('nameInput');
            const btnFindSeat = document.getElementById('btnFindSeat');
            const btnBack = document.getElementById('btnBack');
            const displayName = document.getElementById('displayName');
            const seatBigInfo = document.getElementById('seatBigInfo');
            const errorMessage = document.getElementById('errorMessage');
            const canvas = document.getElementById('seatCanvas');
            const canvasCard = document.getElementById('canvasCard');
            const ctx = canvas.getContext('2d');
            const zoomPct = document.getElementById('zoomPct');

            // 座位数据
            const allSeats = [];
            for (let row = 1; row <= 13; row++) {
                let section = row <= 4 ? 'front' : row <= 9 ? 'middle' : 'back';
                for (let seat = 1; seat <= 10; seat++) {
                    allSeats.push({ zoneLetter: 'A', row, seat, section, code: `A${row}-${seat}` });
                    allSeats.push({ zoneLetter: 'B', row, seat, section, code: `B${row}-${seat}` });
                }
            }
            function hashString(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h) + str
                    .charCodeAt(i) & 0x7fffffff; return h; }

            function getSeatByName(name) { const t = name.trim(); if (!t) return null; return allSeats[hashString(t) %
                    allSeats.length]; }

            // Canvas 逻辑尺寸
            const LW = 660,
                LH = 420;
            const seatW = 15,
                seatH = 12,
                seatGap = 2.5;
            const halfCount = 10;
            const halfW = halfCount * seatW + (halfCount - 1) * seatGap;
            const aisleW = 48;
            const groupW = halfW * 2 + aisleW;
            const startX = (LW - groupW) / 2;
            const rowGap = 18;
            const seatsTop = 60;
            const stageW = 340,
                stageH = 22,
                stageY = 16;

            // 颜色
            const clr = {
                front: { fill: '#eedbb8', stroke: '#c89850' },
                middle: { fill: '#c4daf0', stroke: '#5088b8' },
                back: { fill: '#c0dfcc', stroke: '#589868' }
            };

            function rr(ctx, x, y, w, h, r) {
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
            }

            function drawAll(ctx, userSeat, pulse) {
                ctx.clearRect(0, 0, LW, LH);
                ctx.fillStyle = 'rgba(20,15,35,0.45)';
                ctx.fillRect(0, 0, LW, LH);

                const cx = LW / 2;
                // 舞台
                const sx = cx - stageW / 2;
                const g = ctx.createLinearGradient(sx, stageY, sx, stageY + stageH);
                g.addColorStop(0, '#6b6e7a');
                g.addColorStop(0.5, '#4a4c56');
                g.addColorStop(1, '#2e3038');
                ctx.fillStyle = g;
                rr(ctx, sx, stageY, stageW, stageH, 6);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.06)';
                rr(ctx, sx + 8, stageY + 2, stageW - 16, stageH / 2 - 1, 3);
                ctx.fill();
                ctx.fillStyle = '#dddde4';
                ctx.font = 'bold 11px "PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('舞 台', cx, stageY - 4);

                // A区标签
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.font = 'bold 10px "PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('A 区', startX + halfW / 2, seatsTop - 8);
                ctx.fillText('B 区', startX + halfW + aisleW + halfW / 2, seatsTop - 8);

                // 座位
                for (let row = 1; row <= 13; row++) {
                    const ry = seatsTop + (row - 1) * rowGap;
                    const section = row <= 4 ? 'front' : row <= 9 ? 'middle' : 'back';
                    const c = clr[section];

                    // A区
                    for (let s = 1; s <= halfCount; s++) {
                        const sx2 = startX + (s - 1) * (seatW + seatGap);
                        const isU = userSeat && userSeat.zoneLetter === 'A' && userSeat.row === row && userSeat
                            .seat === s;
                        drawSeat(ctx, sx2, ry, seatW, seatH, c, isU, pulse);
                    }
                    // 过道
                    const ax = startX + halfW;
                    ctx.fillStyle = 'rgba(170,180,195,0.25)';
                    ctx.fillRect(ax + 1, ry, aisleW - 2, seatH);
                    if (row === 6) {
                        ctx.fillStyle = 'rgba(200,210,220,0.6)';
                        ctx.font = '8px "PingFang SC","Microsoft YaHei",sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('过道', ax + aisleW / 2, ry + seatH / 2 + 3);
                    }
                    // B区
                    for (let s = 1; s <= halfCount; s++) {
                        const sx2 = startX + halfW + aisleW + (s - 1) * (seatW + seatGap);
                        const isU = userSeat && userSeat.zoneLetter === 'B' && userSeat.row === row && userSeat
                            .seat === s;
                        drawSeat(ctx, sx2, ry, seatW, seatH, c, isU, pulse);
                    }
                }

                // 分区标签左侧
                const lx = 16;
                ctx.font = 'bold 7.5px "PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'left';
                const fY = seatsTop + 2 * rowGap + 3;
                const mY = seatsTop + 7 * rowGap + 3;
                const bY = seatsTop + 11.5 * rowGap + 3;
                ctx.fillStyle = 'rgba(210,165,105,0.85)';
                ctx.fillText('前排1~4排', lx, fY);
                ctx.fillStyle = 'rgba(120,160,210,0.85)';
                ctx.fillText('中排5~9排', lx, mY);
                ctx.fillStyle = 'rgba(120,180,150,0.85)';
                ctx.fillText('后排10~13排', lx, bY);

                // 分隔虚线
                ctx.strokeStyle = 'rgba(255,255,255,0.22)';
                ctx.lineWidth = 0.5;
                ctx.setLineDash([5, 6]);
                [seatsTop + 4 * rowGap - 1, seatsTop + 9 * rowGap - 1].forEach(y => {
                    ctx.beginPath();
                    ctx.moveTo(20, y);
                    ctx.lineTo(LW - 20, y);
                    ctx.stroke();
                });
                ctx.setLineDash([]);
            }

            function drawSeat(ctx, x, y, w, h, c, isUser, pulse) {
                if (isUser) {
                    const glow = 5 + 3 * Math.sin(pulse);
                    ctx.save();
                    ctx.shadowColor = 'rgba(232,69,91,0.8)';
                    ctx.shadowBlur = 8 + glow;
                    ctx.fillStyle = '#e8455b';
                    rr(ctx, x, y, w, h, 3);
                    ctx.fill();
                    ctx.restore();
                    const g2 = ctx.createLinearGradient(x, y, x, y + h);
                    g2.addColorStop(0, '#ff5c72');
                    g2.addColorStop(1, '#d03048');
                    ctx.fillStyle = g2;
                    rr(ctx, x, y, w, h, 3);
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 1.6;
                    rr(ctx, x, y, w, h, 3);
                    ctx.stroke();
                    const mx = x + w / 2,
                        my = y + h / 2;
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 1.4;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(mx - 3, my);
                    ctx.lineTo(mx - 0.5, my + 2.5);
                    ctx.lineTo(mx + 3, my - 2.5);
                    ctx.stroke();
                    ctx.lineCap = 'butt';
                } else {
                    const g2 = ctx.createLinearGradient(x, y, x, y + h);
                    g2.addColorStop(0, c.fill);
                    g2.addColorStop(1, c.stroke);
                    ctx.fillStyle = g2;
                    rr(ctx, x, y, w, h, 3);
                    ctx.fill();
                    ctx.strokeStyle = c.stroke;
                    ctx.lineWidth = 0.6;
                    rr(ctx, x, y, w, h, 3);
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    rr(ctx, x + 3, y + 2, w - 6, h / 2 - 1, 2);
                    ctx.fill();
                }
            }

            // 缩放状态
            let scale = 1,
                offX = 0,
                offY = 0;
            const MIN_S = 0.5,
                MAX_S = 4;
            let lastPinch = 0,
                lastTx = 0,
                lastTy = 0,
                dragging = false;
            let animId = null,
                curSeat = null,
                pulse = 0;

            function updateZoom() { zoomPct.textContent = Math.round(scale * 100) + '%'; }

            function render() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const dw = canvasCard.clientWidth;
                const dh = dw * LH / LW;
                canvas.width = dw * dpr;
                canvas.height = dh * dpr;
                canvas.style.width = dw + 'px';
                canvas.style.height = dh + 'px';
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);
                const bs = dw / LW;
                ctx.save();
                ctx.translate(offX, offY);
                ctx.scale(bs * scale, bs * scale);
                drawAll(ctx, curSeat, pulse);
                ctx.restore();
            }

            function startAnim(seat) {
                curSeat = seat;
                scale = 1;
                offX = 0;
                offY = 0;
                updateZoom();
                if (animId) cancelAnimationFrame(animId);

                function loop(ts) {
                    pulse = (ts / 700) * Math.PI * 2;
                    render();
                    animId = requestAnimationFrame(loop);
                }
                animId = requestAnimationFrame(loop);
            }

            function stopAnim() { if (animId) { cancelAnimationFrame(animId);
                    animId = null; } curSeat = null; }

            function pinchDist(t1, t2) { return Math.sqrt((t1.clientX - t2.clientX) ** 2 + (t1.clientY - t2.clientY) **
                    2); }

            canvas.addEventListener('touchstart', function(e) {
                e.preventDefault();
                if (e.touches.length === 2) { dragging = false;
                    lastPinch = pinchDist(e.touches[0], e.touches[1]); } else if (e.touches.length === 1) { dragging =
                        true;
                    lastTx = e.touches[0].clientX;
                    lastTy = e.touches[0].clientY; }
            }, { passive: false });
            canvas.addEventListener('touchmove', function(e) {
                e.preventDefault();
                if (e.touches.length === 2) {
                    dragging = false;
                    const nd = pinchDist(e.touches[0], e.touches[1]);
                    const rect = canvas.getBoundingClientRect();
                    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
                    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
                    if (lastPinch > 0) {
                        const r = nd / lastPinch;
                        const ns = Math.min(MAX_S, Math.max(MIN_S, scale * r));
                        offX = cx - (cx - offX) * (ns / scale);
                        offY = cy - (cy - offY) * (ns / scale);
                        scale = ns;
                        updateZoom();
                    }
                    lastPinch = nd;
                } else if (e.touches.length === 1 && dragging) {
                    offX += e.touches[0].clientX - lastTx;
                    offY += e.touches[0].clientY - lastTy;
                    lastTx = e.touches[0].clientX;
                    lastTy = e.touches[0].clientY;
                }
            }, { passive: false });
            canvas.addEventListener('touchend', function(e) { if (e.touches.length === 0) { dragging = false;
                    lastPinch = 0; } });
            canvas.addEventListener('wheel', function(e) {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left,
                    my = e.clientY - rect.top;
                const ns = Math.min(MAX_S, Math.max(MIN_S, scale * (e.deltaY > 0 ? 0.9 : 1.1)));
                offX = mx - (mx - offX) * (ns / scale);
                offY = my - (my - offY) * (ns / scale);
                scale = ns;
                updateZoom();
            }, { passive: false });

            document.getElementById('zoomInBtn').addEventListener('click', () => {
                const ns = Math.min(MAX_S, scale * 1.35);
                const dw = canvasCard.clientWidth,
                    dh = dw * LH / LW;
                offX = dw / 2 - (dw / 2 - offX) * (ns / scale);
                offY = dh / 2 - (dh / 2 - offY) * (ns / scale);
                scale = ns;
                updateZoom();
            });
            document.getElementById('zoomOutBtn').addEventListener('click', () => {
                const ns = Math.max(MIN_S, scale / 1.35);
                const dw = canvasCard.clientWidth,
                    dh = dw * LH / LW;
                offX = dw / 2 - (dw / 2 - offX) * (ns / scale);
                offY = dh / 2 - (dh / 2 - offY) * (ns / scale);
                scale = ns;
                updateZoom();
            });
            document.getElementById('zoomResetBtn').addEventListener('click', () => { scale = 1;
                offX = 0;
                offY = 0;
                updateZoom(); });

            let resizeT;
            window.addEventListener('resize', () => { clearTimeout(resizeT);
                resizeT = setTimeout(() => { if (curSeat) render(); }, 200); });

            // UI
            function buildBigInfoHTML(seat) {
                const sc = seat.section;
                const st = sc === 'front' ? '前排' : sc === 'middle' ? '中排' : '后排';
                return `
                    <div class="seat-zone-display"><span class="zone-badge ${sc}">${seat.zoneLetter}</span><span class="zone-text">${seat.zoneLetter}区 · ${st}</span></div>
                    <div class="seat-detail-row"><span class="seat-detail-item">第 ${seat.row} 排</span><span class="seat-detail-divider">·</span><span class="seat-detail-item">第 ${seat.seat} 座</span></div>
                    <span class="seat-code">🏷️ 编号：${seat.code}</span>`;
            }

            function showError(msg) {
                errorMessage.textContent = msg;
                errorMessage.classList.add('show');
                nameInput.style.borderColor = 'rgba(255,138,138,0.9)';
                setTimeout(() => { errorMessage.classList.remove('show');
                    nameInput.style.borderColor = 'rgba(255,255,255,0.35)'; }, 2000);
            }

            function showPage(p) { [pageHome, pageResult].forEach(x => x.classList.add('hidden'));
                p.classList.remove('hidden'); }

            function showResult(name, seat) {
                displayName.textContent = name.trim();
                seatBigInfo.innerHTML = buildBigInfoHTML(seat);
                showPage(pageResult);
                startAnim(seat);
                const url = new URL(window.location);
                url.searchParams.set('name', name.trim());
                history.pushState(null, '', url.toString());
                pageResult.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            btnFindSeat.addEventListener('click', () => {
                const name = nameInput.value.trim();
                if (!name) { showError('请输入姓名'); return; }
                const seat = getSeatByName(name);
                if (!seat) { showError('未找到对应座位，请重试'); return; }
                showResult(name, seat);
            });
            nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault();
                    btnFindSeat.click(); } });
            btnBack.addEventListener('click', () => { stopAnim();
                showPage(pageHome);
                nameInput.focus(); if (window.location.search.includes('name=')) history.pushState(null, '',
                    window.location.pathname); });

            window.addEventListener('popstate', () => {
                const p = new URLSearchParams(window.location.search);
                const nm = p.get('name');
                if (nm && nm.trim()) { const seat = getSeatByName(nm); if (seat) { showResult(nm, seat); return; } }
                stopAnim();
                showPage(pageHome);
                nameInput.focus();
            });

            function init() {
                const p = new URLSearchParams(window.location.search);
                const nm = p.get('name');
                if (nm && nm.trim()) { const seat = getSeatByName(nm); if (seat) { showResult(nm, seat); return; } }
                showPage(pageHome);
                nameInput.focus();
            }
            init();
        })();
    </script>
</body>
</html>
