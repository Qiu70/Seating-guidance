<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>座位导航 · 左海产业生态大会</title>
    <style>
        :root {
            --card-max-width: 400px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .bg-fixed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('背景.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', system-ui, sans-serif;
            background-color: #3c1a6e;
            color: #f0eaff;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3vw;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .page {
            width: 100%;
            display: flex;
            justify-content: center;
            transition: opacity 0.35s ease;
        }
        .page.hidden {
            display: none !important;
        }
        .page.active {
            display: flex;
        }

        /* 毛玻璃卡片 */
        .glass-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4.5vw;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.18);
            padding: 5vw 4vw;
            text-align: center;
        }

        /* ========== 首页 ========== */
        .home-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 3vw;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.28);
        }
        .home-icon svg {
            width: 28px;
            height: 28px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .home-title {
            font-size: 5.2vw;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
            margin-bottom: 1.5vw;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        .home-subtitle {
            font-size: 3.4vw;
            color: rgba(255, 255, 255, 0.78);
            margin-bottom: 5.5vw;
        }

        .input-wrap {
            position: relative;
            margin-bottom: 2vw;
        }
        .input-wrap input {
            width: 100%;
            padding: 3.6vw 9vw 3.6vw 3.6vw;
            font-size: 3.8vw;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 10vw;
            outline: none;
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            text-align: center;
            letter-spacing: 0.5px;
            transition: background 0.2s, border-color 0.2s;
        }
        .input-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        .input-wrap input:focus {
            border-color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.24);
        }
        .input-icon {
            position: absolute;
            right: 3.5vw;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: rgba(255, 255, 255, 0.55);
            width: 4vw;
            height: 4vw;
        }

        .error-message {
            display: block;
            height: 4.5vw;
            line-height: 4.5vw;
            font-size: 3vw;
            color: #ffaaaa;
            margin-bottom: 2vw;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .error-message.show {
            opacity: 1;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 2vw;
            padding: 3.6vw 5vw;
            font-size: 4vw;
            font-weight: 600;
            border: none;
            border-radius: 10vw;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            outline: none;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            color: #5b21b6;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.14);
            touch-action: manipulation;
        }
        .btn:active {
            transform: scale(0.97);
            background: #fff;
        }
        .btn-outline-sm {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            width: auto;
            padding: 2vw 4vw;
            font-size: 3.2vw;
            border-radius: 8vw;
            box-shadow: none;
        }
        .home-hint {
            margin-top: 2.5vw;
            font-size: 2.8vw;
            color: rgba(255, 255, 255, 0.5);
        }

        /* ========== 结果页 ========== */
        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 3vw;
        }
        .result-greeting {
            font-size: 4.2vw;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }
        .result-greeting .name-em {
            color: #fff;
            font-weight: 800;
        }

        .seat-big-info {
            margin: 3vw 0;
            padding: 4vw 3.5vw;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3vw;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .seat-zone-display {
            display: inline-flex;
            align-items: center;
            gap: 2.5vw;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 8vw;
            padding: 2vw 4vw;
            margin-bottom: 2.5vw;
            border: 1px solid rgba(255, 255, 255, 0.22);
        }
        .zone-badge {
            width: 9vw;
            height: 9vw;
            max-width: 40px;
            max-height: 40px;
            border-radius: 50%;
            font-size: 4.5vw;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .zone-badge.front {
            background: #e8963a;
        }
        .zone-badge.middle {
            background: #3d7ec5;
        }
        .zone-badge.back {
            background: #4a9d6e;
        }
        .zone-text {
            font-size: 3.6vw;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            text-align: left;
        }
        .seat-detail-row {
            display: flex;
            flex-wrap: wrap;
            gap: 2.5vw;
            justify-content: center;
            align-items: center;
            margin: 1vw 0;
        }
        .seat-detail-item {
            font-size: 5.5vw;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }
        .seat-detail-divider {
            font-size: 3.5vw;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
        }
        .seat-code {
            font-size: 3.5vw;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.12);
            padding: 1.5vw 4vw;
            border-radius: 5vw;
            letter-spacing: 1px;
            margin-top: 1.5vw;
            display: inline-block;
        }

        /* ========== 图片查看器（嵌入结果页） ========== */
        .image-section {
            margin-top: 3vw;
        }
        .image-section-title {
            font-size: 3.6vw;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 2vw;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5vw;
        }
        .image-viewer {
            width: 100%;
            background: rgba(20, 15, 35, 0.5);
            border-radius: 3vw;
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            position: relative;
            touch-action: none;
            cursor: grab;
        }
        .image-viewer:active {
            cursor: grabbing;
        }
        .image-viewer img {
            display: block;
            width: 100%;
            height: auto;
            transform-origin: 0 0;
            pointer-events: none;
        }

        .zoom-controls {
            display: flex;
            gap: 2.5vw;
            justify-content: center;
            align-items: center;
            margin-top: 2.5vw;
            flex-wrap: wrap;
        }
        .btn-ctrl {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 2.2vw 4vw;
            font-size: 3.5vw;
            border-radius: 7vw;
            cursor: pointer;
            min-width: 10vw;
            text-align: center;
            font-weight: 600;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .btn-ctrl:active {
            background: rgba(255, 255, 255, 0.35);
        }
        .zoom-indicator {
            color: rgba(255, 255, 255, 0.75);
            font-size: 3vw;
            min-width: 12vw;
            text-align: center;
            font-weight: 500;
        }
        .hint-text {
            text-align: center;
            font-size: 2.6vw;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 1.5vw;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 360px) {
            .home-title {
                font-size: 5.8vw;
            }
            .home-subtitle {
                font-size: 3.8vw;
            }
            .input-wrap input {
                padding: 4vw 11vw 4vw 4vw;
                font-size: 4vw;
            }
            .btn {
                padding: 4vw 6vw;
                font-size: 4.2vw;
            }
            .seat-detail-item {
                font-size: 6vw;
            }
            .btn-ctrl {
                padding: 2.5vw 4.5vw;
                font-size: 3.8vw;
            }
        }

        @media (min-width: 420px) {
            .glass-card {
                border-radius: 18px;
                padding: 24px 20px;
            }
            .home-title {
                font-size: 1.25rem;
            }
            .home-subtitle {
                font-size: 0.8rem;
            }
            .input-wrap input {
                padding: 13px 38px 13px 14px;
                font-size: 0.88rem;
            }
            .btn {
                padding: 13px 24px;
                font-size: 0.88rem;
            }
            .seat-detail-item {
                font-size: 1.35rem;
            }
            .zone-text {
                font-size: 0.82rem;
            }
            .error-message {
                height: 18px;
                line-height: 18px;
                font-size: 0.68rem;
            }
            .btn-ctrl {
                padding: 8px 16px;
                font-size: 0.85rem;
                border-radius: 24px;
            }
            .zoom-indicator {
                font-size: 0.8rem;
            }
            .hint-text {
                font-size: 0.7rem;
            }
            .image-section-title {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-fixed"></div>

    <div class="app-container" id="mainAppContainer">
        <!-- ========== 首页 ========== -->
        <div class="page active" id="page-home">
            <div class="glass-card">
                <div class="home-icon">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="5" width="18" height="2.5" rx="1" />
                        <rect x="5.5" y="10" width="3.5" height="3.5" rx="0.8" />
                        <rect x="11" y="10" width="3.5" height="3.5" rx="0.8" />
                        <rect x="16.5" y="10" width="3.5" height="3.5" rx="0.8" />
                        <rect x="5.5" y="16" width="3.5" height="3.5" rx="0.8" />
                        <rect x="11" y="16" width="5" height="3.5" rx="0.8" fill="currentColor" stroke="none" opacity="0.35" />
                        <circle cx="13.5" cy="17.75" r="1" fill="#fff" />
                    </svg>
                </div>
                <h1 class="home-title">座位导航</h1>
                <p class="home-subtitle">输入姓名，查看您的座位</p>
                <div class="input-wrap">
                    <input type="text" id="nameInput" placeholder="请输入姓名" autocomplete="name" maxlength="30">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2" />
                    </svg>
                </div>
                <span class="error-message" id="errorMessage">请输入姓名</span>
                <button class="btn" id="btnFindSeat" type="button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:4vw;height:4vw;">
                        <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    查找座位
                </button>
                <p class="home-hint">试试输入"张三"或"李小明"</p>
            </div>
        </div>

        <!-- ========== 结果页（含座位信息+座位图） ========== -->
        <div class="page hidden" id="page-result">
            <div class="glass-card">
                <div class="result-header">
                    <div class="result-greeting">
                        👋 <span class="name-em" id="displayName">---</span> 的座位
                    </div>
                    <button class="btn btn-outline-sm" id="btnBack" type="button">← 返回</button>
                </div>

                <!-- 大字座位信息 -->
                <div class="seat-big-info" id="seatBigInfo"></div>

                <!-- 高清座位图（直接嵌入） -->
                <div class="image-section">
                    <div class="image-section-title">
                        <span>🏛️</span> 会场全局座位图 <span>🏛️</span>
                    </div>

                    <div class="image-viewer" id="imageViewer">
                        <!--
                          ★ 替换 src 为你的高清座位图地址 ★
                          本地：src="images/seat-map.jpg"
                          网络：src="https://example.com/seat-map.jpg"
                        -->
                        <img id="seatImage" src="https://placehold.co/1200x900/2c1a4a/f0eaff?text=请替换为高清座位图" alt="全局座位图">
                    </div>

                    <!-- 缩放控制 -->
                    <div class="zoom-controls">
                        <button class="btn-ctrl" id="zoomOutBtn" type="button">−</button>
                        <span class="zoom-indicator" id="zoomIndicator">100%</span>
                        <button class="btn-ctrl" id="zoomInBtn" type="button">+</button>
                        <button class="btn-ctrl" id="zoomResetBtn" type="button">↺ 重置</button>
                    </div>
                    <p class="hint-text">👆 双指缩放 · 单指拖动查看细节</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ============ DOM ============
            const pageHome = document.getElementById('page-home');
            const pageResult = document.getElementById('page-result');
            const nameInput = document.getElementById('nameInput');
            const btnFindSeat = document.getElementById('btnFindSeat');
            const btnBack = document.getElementById('btnBack');
            const displayName = document.getElementById('displayName');
            const seatBigInfo = document.getElementById('seatBigInfo');
            const errorMessage = document.getElementById('errorMessage');

            const imageViewer = document.getElementById('imageViewer');
            const seatImage = document.getElementById('seatImage');
            const zoomIndicator = document.getElementById('zoomIndicator');

            // ============ 座位数据 ============
            const allSeats = [];
            for (let row = 1; row <= 13; row++) {
                let section = row <= 4 ? 'front' : row <= 9 ? 'middle' : 'back';
                for (let seat = 1; seat <= 10; seat++) {
                    allSeats.push({ zoneLetter: 'A', row, seat, section, code: `A${row}-${seat}` });
                    allSeats.push({ zoneLetter: 'B', row, seat, section, code: `B${row}-${seat}` });
                }
            }

            function hashString(str) {
                let hash = 5381;
                for (let i = 0; i < str.length; i++) {
                    hash = ((hash << 5) + hash) + str.charCodeAt(i);
                    hash = hash & 0x7fffffff;
                }
                return hash;
            }

            function getSeatByName(name) {
                const trimmed = name.trim();
                if (!trimmed) return null;
                return allSeats[hashString(trimmed) % allSeats.length];
            }

            // ============ 图片缩放状态 ============
            let imgScale = 1;
            let imgOffsetX = 0;
            let imgOffsetY = 0;
            const IMG_MIN_SCALE = 0.5;
            const IMG_MAX_SCALE = 5;

            let lastPinchDist = 0;
            let lastSingleTouch = { x: 0, y: 0 };
            let isImgDragging = false;

            function updateImageTransform() {
                seatImage.style.transform = `translate(${imgOffsetX}px, ${imgOffsetY}px) scale(${imgScale})`;
                zoomIndicator.textContent = Math.round(imgScale * 100) + '%';
            }

            function resetImageZoom() {
                imgScale = 1;
                imgOffsetX = 0;
                imgOffsetY = 0;
                updateImageTransform();
            }

            // ============ 图片触摸事件 ============
            function getPinchDist(t1, t2) {
                return Math.sqrt((t1.clientX - t2.clientX) ** 2 + (t1.clientY - t2.clientY) ** 2);
            }

            imageViewer.addEventListener('touchstart', function(e) {
                if (e.touches.length === 2) {
                    isImgDragging = false;
                    lastPinchDist = getPinchDist(e.touches[0], e.touches[1]);
                } else if (e.touches.length === 1) {
                    isImgDragging = true;
                    lastSingleTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
            }, { passive: false });

            imageViewer.addEventListener('touchmove', function(e) {
                e.preventDefault();
                if (e.touches.length === 2) {
                    isImgDragging = false;
                    const newDist = getPinchDist(e.touches[0], e.touches[1]);
                    const rect = imageViewer.getBoundingClientRect();
                    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
                    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
                    if (lastPinchDist > 0) {
                        const ratio = newDist / lastPinchDist;
                        const newScale = Math.min(IMG_MAX_SCALE, Math.max(IMG_MIN_SCALE, imgScale * ratio));
                        imgOffsetX = cx - (cx - imgOffsetX) * (newScale / imgScale);
                        imgOffsetY = cy - (cy - imgOffsetY) * (newScale / imgScale);
                        imgScale = newScale;
                        updateImageTransform();
                    }
                    lastPinchDist = newDist;
                } else if (e.touches.length === 1 && isImgDragging) {
                    const dx = e.touches[0].clientX - lastSingleTouch.x;
                    const dy = e.touches[0].clientY - lastSingleTouch.y;
                    imgOffsetX += dx;
                    imgOffsetY += dy;
                    lastSingleTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                    updateImageTransform();
                }
            }, { passive: false });

            imageViewer.addEventListener('touchend', function(e) {
                if (e.touches.length === 0) {
                    isImgDragging = false;
                    lastPinchDist = 0;
                }
            });

            imageViewer.addEventListener('wheel', function(e) {
                e.preventDefault();
                const rect = imageViewer.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                const newScale = Math.min(IMG_MAX_SCALE, Math.max(IMG_MIN_SCALE, imgScale * delta));
                imgOffsetX = mx - (mx - imgOffsetX) * (newScale / imgScale);
                imgOffsetY = my - (my - imgOffsetY) * (newScale / imgScale);
                imgScale = newScale;
                updateImageTransform();
            }, { passive: false });

            // 缩放按钮
            document.getElementById('zoomInBtn').addEventListener('click', () => {
                const newScale = Math.min(IMG_MAX_SCALE, imgScale * 1.35);
                const dw = imageViewer.clientWidth;
                const dh = imageViewer.clientHeight;
                imgOffsetX = dw / 2 - (dw / 2 - imgOffsetX) * (newScale / imgScale);
                imgOffsetY = dh / 2 - (dh / 2 - imgOffsetY) * (newScale / imgScale);
                imgScale = newScale;
                updateImageTransform();
            });
            document.getElementById('zoomOutBtn').addEventListener('click', () => {
                const newScale = Math.max(IMG_MIN_SCALE, imgScale / 1.35);
                const dw = imageViewer.clientWidth;
                const dh = imageViewer.clientHeight;
                imgOffsetX = dw / 2 - (dw / 2 - imgOffsetX) * (newScale / imgScale);
                imgOffsetY = dh / 2 - (dh / 2 - imgOffsetY) * (newScale / imgScale);
                imgScale = newScale;
                updateImageTransform();
            });
            document.getElementById('zoomResetBtn').addEventListener('click', resetImageZoom);

            // ============ UI逻辑 ============
            function buildBigInfoHTML(seat) {
                const sectionClass = seat.section;
                const sectionText = seat.section === 'front' ? '前排' : seat.section === 'middle' ? '中排' :
                '后排';
                return `
                    <div class="seat-zone-display">
                        <span class="zone-badge ${sectionClass}">${seat.zoneLetter}</span>
                        <span class="zone-text">${seat.zoneLetter}区 · ${sectionText}</span>
                    </div>
                    <div class="seat-detail-row">
                        <span class="seat-detail-item">第 ${seat.row} 排</span>
                        <span class="seat-detail-divider">·</span>
                        <span class="seat-detail-item">第 ${seat.seat} 座</span>
                    </div>
                    <span class="seat-code">🏷️ 编号：${seat.code}</span>
                `;
            }

            function showError(msg) {
                errorMessage.textContent = msg;
                errorMessage.classList.add('show');
                nameInput.style.borderColor = 'rgba(255,138,138,0.9)';
                setTimeout(() => {
                    errorMessage.classList.remove('show');
                    nameInput.style.borderColor = 'rgba(255,255,255,0.35)';
                }, 2000);
            }

            function showPage(page) {
                [pageHome, pageResult].forEach(p => p.classList.add('hidden'));
                page.classList.remove('hidden');
            }

            function showResult(name, seat) {
                displayName.textContent = name.trim();
                seatBigInfo.innerHTML = buildBigInfoHTML(seat);
                showPage(pageResult);
                resetImageZoom();
                const url = new URL(window.location);
                url.searchParams.set('name', name.trim());
                history.pushState(null, '', url.toString());
                pageResult.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            btnFindSeat.addEventListener('click', () => {
                const name = nameInput.value.trim();
                if (!name) { showError('请输入姓名'); return; }
                const seat = getSeatByName(name);
                if (!seat) { showError('未找到对应座位，请重试'); return; }
                showResult(name, seat);
            });
            nameInput.addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault();
                    btnFindSeat.click(); }
            });
            btnBack.addEventListener('click', () => {
                showPage(pageHome);
                nameInput.focus();
                if (window.location.search.includes('name=')) history.pushState(null, '', window.location
                .pathname);
            });

            window.addEventListener('popstate', () => {
                const params = new URLSearchParams(window.location.search);
                const nameParam = params.get('name');
                if (nameParam && nameParam.trim()) {
                    const seat = getSeatByName(nameParam);
                    if (seat) { showResult(nameParam, seat); return; }
                }
                showPage(pageHome);
                nameInput.focus();
            });

            function init() {
                const params = new URLSearchParams(window.location.search);
                const nameParam = params.get('name');
                if (nameParam && nameParam.trim()) {
                    const seat = getSeatByName(nameParam);
                    if (seat) { showResult(nameParam, seat); return; }
                }
                showPage(pageHome);
                nameInput.focus();
            }
            init();
        })();
    </script>
</body>
</html>
