<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>座位导航 · 左海产业生态大会</title>
    <style>
        :root {
            --card-max-width: 400px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .bg-fixed {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('背景.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            z-index: -2;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', system-ui, sans-serif;
            background-color: #3c1a6e;
            color: #f0eaff;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2vw;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .page {
            width: 100%;
            display: flex;
            justify-content: center;
            transition: opacity 0.35s ease;
        }
        .page.hidden { display: none !important; }
        .page.active { display: flex; }

        .glass-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 3.5vw;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.18);
            padding: 4vw 3.5vw;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* 首页 */
        .home-icon {
            width: 52px; height: 52px; margin: 0 auto 2.5vw;
            background: rgba(255, 255, 255, 0.18); border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.28);
        }
        .home-icon svg { width: 28px; height: 28px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .home-title {
            font-size: 5vw; font-weight: 700; color: #fff; letter-spacing: 0.5px; margin-bottom: 1.2vw;
            text-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .home-subtitle { font-size: 3.2vw; color: rgba(255,255,255,0.78); margin-bottom: 5vw; }
        .input-wrap { position: relative; margin-bottom: 1.5vw; }
        .input-wrap input {
            width: 100%; padding: 3.4vw 8vw 3.4vw 3.4vw; font-size: 3.6vw;
            border: 2px solid rgba(255,255,255,0.35); border-radius: 10vw; outline: none;
            background: rgba(255,255,255,0.14); color: #fff; text-align: center; letter-spacing: 0.5px;
            transition: background 0.2s, border-color 0.2s;
        }
        .input-wrap input::placeholder { color: rgba(255,255,255,0.5); }
        .input-wrap input:focus { border-color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.24); }
        .input-icon {
            position: absolute; right: 3.2vw; top: 50%; transform: translateY(-50%);
            pointer-events: none; color: rgba(255,255,255,0.55); width: 3.8vw; height: 3.8vw;
        }
        .error-message {
            display: block; height: 4vw; line-height: 4vw; font-size: 2.8vw; color: #ffaaaa;
            margin-bottom: 1.5vw; opacity: 0; transition: opacity 0.2s;
        }
        .error-message.show { opacity: 1; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 2vw;
            padding: 3.4vw 5vw; font-size: 3.8vw; font-weight: 600; border: none; border-radius: 10vw;
            cursor: pointer; transition: background 0.2s, transform 0.1s; outline: none; width: 100%;
            background: rgba(255,255,255,0.9); color: #5b21b6;
            box-shadow: 0 4px 16px rgba(0,0,0,0.14); touch-action: manipulation;
        }
        .btn:active { transform: scale(0.97); background: #fff; }
        .btn-outline-sm {
            background: rgba(255,255,255,0.15); color: #fff;
            border: 1.5px solid rgba(255,255,255,0.4); width: auto; padding: 2vw 3.5vw;
            font-size: 3vw; border-radius: 7vw; box-shadow: none;
        }
        .home-hint { margin-top: 2.2vw; font-size: 2.6vw; color: rgba(255,255,255,0.5); }

        /* 结果页 */
        .result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2.5vw; }
        .result-greeting { font-size: 4vw; font-weight: 600; color: rgba(255,255,255,0.9); }
        .result-greeting .name-em { color: #fff; font-weight: 800; }

        .seat-big-info {
            margin: 2.5vw 0; padding: 3.5vw 3vw; background: rgba(255,255,255,0.1);
            border-radius: 2.5vw; border: 1px solid rgba(255,255,255,0.2);
        }
        .seat-zone-display {
            display: inline-flex; align-items: center; gap: 2.2vw;
            background: rgba(255,255,255,0.14); border-radius: 7vw; padding: 1.8vw 3.5vw;
            margin-bottom: 2vw; border: 1px solid rgba(255,255,255,0.22);
        }
        .zone-badge {
            width: 8.5vw; height: 8.5vw; max-width: 36px; max-height: 36px; border-radius: 50%;
            font-size: 4.2vw; font-weight: 800; color: #fff; display: flex;
            align-items: center; justify-content: center; flex-shrink: 0;
        }
        .zone-badge.front { background: #c98a3a; }
        .zone-badge.middle { background: #3b72b5; }
        .zone-badge.back { background: #4a9068; }
        .zone-text { font-size: 3.4vw; font-weight: 600; color: rgba(255,255,255,0.9); text-align: left; }
        .seat-detail-row { display: flex; flex-wrap: wrap; gap: 2.2vw; justify-content: center; align-items: center; margin: 1vw 0; }
        .seat-detail-item { font-size: 5.2vw; font-weight: 800; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.15); }
        .seat-detail-divider { font-size: 3.2vw; color: rgba(255,255,255,0.5); font-weight: 300; }
        .seat-code {
            font-size: 3.2vw; font-weight: 700; color: rgba(255,255,255,0.85);
            background: rgba(255,255,255,0.12); padding: 1.3vw 3.5vw; border-radius: 4.5vw;
            letter-spacing: 1px; margin-top: 1.2vw; display: inline-block;
        }

        /* 示意图区域 - 最大化 */
        .canvas-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 0;
        }
        .canvas-section-title {
            font-size: 3.2vw; font-weight: 600; color: rgba(255,255,255,0.75);
            margin-bottom: 1.5vw;
            flex-shrink: 0;
        }
        .canvas-card {
            flex: 1;
            width: 100%;
            min-height: 0;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 2.5vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            cursor: grab;
        }
        .canvas-card canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transform-origin: 0 0;
        }
        .zoom-controls {
            display: flex;
            gap: 2.2vw;
            justify-content: center;
            align-items: center;
            margin-top: 2vw;
            flex-shrink: 0;
        }
        .btn-ctrl {
            background: rgba(255,255,255,0.16); color: #fff;
            border: 1px solid rgba(255,255,255,0.28); padding: 1.8vw 3.2vw;
            font-size: 3vw; border-radius: 6vw; cursor: pointer; font-weight: 600;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .btn-ctrl:active { background: rgba(255,255,255,0.3); }
        .zoom-pct { color: rgba(255,255,255,0.7); font-size: 2.8vw; min-width: 9vw; text-align: center; }
        .zoom-hint { text-align: center; font-size: 2.2vw; color: rgba(255,255,255,0.4); margin-top: 1vw; flex-shrink: 0; }

        @media (max-width: 360px) {
            .home-title { font-size: 5.5vw; }
            .btn-ctrl { padding: 2.2vw 3.8vw; font-size: 3.2vw; }
        }
        @media (min-width: 420px) {
            .glass-card { border-radius: 16px; padding: 22px 18px; }
            .home-title { font-size: 1.2rem; }
            .home-subtitle { font-size: 0.78rem; }
            .input-wrap input { padding: 12px 36px 12px 14px; font-size: 0.85rem; }
            .btn { padding: 12px 22px; font-size: 0.85rem; }
            .seat-detail-item { font-size: 1.3rem; }
            .error-message { height: 16px; line-height: 16px; font-size: 0.65rem; }
            .btn-ctrl { padding: 7px 13px; font-size: 0.78rem; border-radius: 20px; }
            .zoom-pct { font-size: 0.75rem; }
            .canvas-section-title { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="bg-fixed"></div>

<div class="app-container">
    <!-- 首页 -->
    <div class="page active" id="page-home">
        <div class="glass-card">
            <div class="home-icon">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="5" width="18" height="2.5" rx="1" />
                    <rect x="5.5" y="10" width="3.5" height="3.5" rx="0.8" />
                    <rect x="11" y="10" width="3.5" height="3.5" rx="0.8" />
                    <rect x="16.5" y="10" width="3.5" height="3.5" rx="0.8" />
                    <rect x="5.5" y="16" width="3.5" height="3.5" rx="0.8" />
                    <rect x="11" y="16" width="5" height="3.5" rx="0.8" fill="currentColor" stroke="none" opacity="0.35" />
                    <circle cx="13.5" cy="17.75" r="1" fill="#fff" />
                </svg>
            </div>
            <h1 class="home-title">座位导航</h1>
            <p class="home-subtitle">输入姓名，查看您的座位</p>
            <div class="input-wrap">
                <input type="text" id="nameInput" placeholder="请输入姓名" autocomplete="name" maxlength="30">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="4" /><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2" />
                </svg>
            </div>
            <span class="error-message" id="errorMessage">请输入姓名</span>
            <button class="btn" id="btnFindSeat" type="button">查找座位</button>
            <p class="home-hint">试试输入“张三”或“李小明”</p>
        </div>
    </div>

    <!-- 结果页 -->
    <div class="page hidden" id="page-result">
        <div class="glass-card">
            <div class="result-header">
                <div class="result-greeting">👋 <span class="name-em" id="displayName">---</span> 的座位</div>
                <button class="btn btn-outline-sm" id="btnBack" type="button">← 返回</button>
            </div>
            <div class="seat-big-info" id="seatBigInfo"></div>

            <!-- 示意图区域 - 最大化 -->
            <div class="canvas-section">
                <div class="canvas-section-title">会场座位示意图</div>
                <div class="canvas-card" id="canvasCard">
                    <canvas id="seatCanvas"></canvas>
                </div>
                <div class="zoom-controls">
                    <button class="btn-ctrl" id="zoomOutBtn" type="button">−</button>
                    <span class="zoom-pct" id="zoomPct">100%</span>
                    <button class="btn-ctrl" id="zoomInBtn" type="button">+</button>
                    <button class="btn-ctrl" id="zoomResetBtn" type="button">↺</button>
                </div>
                <p class="zoom-hint">双指缩放 · 单指拖动查看细节</p>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    const pageHome = document.getElementById('page-home');
    const pageResult = document.getElementById('page-result');
    const nameInput = document.getElementById('nameInput');
    const btnFindSeat = document.getElementById('btnFindSeat');
    const btnBack = document.getElementById('btnBack');
    const displayName = document.getElementById('displayName');
    const seatBigInfo = document.getElementById('seatBigInfo');
    const errorMessage = document.getElementById('errorMessage');
    const canvas = document.getElementById('seatCanvas');
    const canvasCard = document.getElementById('canvasCard');
    const ctx = canvas.getContext('2d');
    const zoomPct = document.getElementById('zoomPct');

    // 座位数据
    const allSeats = [];
    for (let row = 1; row <= 13; row++) {
        let section = row <= 4 ? 'front' : row <= 9 ? 'middle' : 'back';
        for (let seat = 1; seat <= 10; seat++) {
            allSeats.push({ zoneLetter: 'A', row, seat, section, code: `A${row}-${seat}` });
            allSeats.push({ zoneLetter: 'B', row, seat, section, code: `B${row}-${seat}` });
        }
    }

    function hashString(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h) + str.charCodeAt(i) & 0x7fffffff; return h; }
    function getSeatByName(name) { const t = name.trim(); if (!t) return null; return allSeats[hashString(t) % allSeats.length]; }

    // 扩大逻辑尺寸，让示意图更大
    const LW = 800, LH = 560;
    const seatW = 18, seatH = 15, seatGap = 3;
    const halfCount = 10;
    const halfW = halfCount * seatW + (halfCount - 1) * seatGap;
    const aisleW = 56;
    const groupW = halfW * 2 + aisleW;
    const startX = (LW - groupW) / 2;
    const rowGap = 20;
    const seatsTop = 80;
    const stageW = 380, stageH = 28, stageY = 20;

    const colors = {
        front: { fill: '#eedbb8', stroke: '#c89850' },
        middle: { fill: '#c4daf0', stroke: '#5088b8' },
        back: { fill: '#b8d8c4', stroke: '#589868' }
    };

    function drawRoundedRect(ctx, x, y, w, h, r) {
        ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r); ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
    }

    function drawSeat(ctx, x, y, w, h, color, isUser, pulse) {
        if (isUser) {
            const glow = 5 + 3 * Math.sin(pulse);
            ctx.save(); ctx.shadowColor = 'rgba(232,69,91,0.85)'; ctx.shadowBlur = 8 + glow;
            ctx.fillStyle = '#e8455b'; drawRoundedRect(ctx, x, y, w, h, 3); ctx.fill(); ctx.restore();
            const grad = ctx.createLinearGradient(x, y, x, y + h);
            grad.addColorStop(0, '#ff5c72'); grad.addColorStop(1, '#d03048');
            ctx.fillStyle = grad; drawRoundedRect(ctx, x, y, w, h, 3); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.8; drawRoundedRect(ctx, x, y, w, h, 3); ctx.stroke();
            const mx = x + w / 2, my = y + h / 2;
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(mx - 3, my); ctx.lineTo(mx - 0.5, my + 2.5); ctx.lineTo(mx + 3, my - 2.5); ctx.stroke();
            ctx.lineCap = 'butt';
        } else {
            const grad = ctx.createLinearGradient(x, y, x, y + h);
            grad.addColorStop(0, color.fill); grad.addColorStop(1, color.stroke);
            ctx.fillStyle = grad; drawRoundedRect(ctx, x, y, w, h, 3); ctx.fill();
            ctx.strokeStyle = color.stroke; ctx.lineWidth = 0.7; drawRoundedRect(ctx, x, y, w, h, 3); ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            drawRoundedRect(ctx, x + 3.5, y + 2.5, w - 7, h / 2 - 1, 2); ctx.fill();
        }
    }

    function drawAll(ctx, userSeat, pulse) {
        ctx.clearRect(0, 0, LW, LH);
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(0, 0, LW, LH);

        const cx = LW / 2;
        // 舞台
        const sx = cx - stageW / 2;
        const g = ctx.createLinearGradient(sx, stageY, sx, stageY + stageH);
        g.addColorStop(0, '#6b6e7a'); g.addColorStop(0.5, '#4a4c56'); g.addColorStop(1, '#2e3038');
        ctx.fillStyle = g; drawRoundedRect(ctx, sx, stageY, stageW, stageH, 6); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        drawRoundedRect(ctx, sx + 12, stageY + 3, stageW - 24, stageH * 0.4, 3); ctx.fill();
        ctx.fillStyle = '#dddde4';
        ctx.font = 'bold 12px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('舞 台', cx, stageY - 5);

        // 区域标签 (A/B区)
        ctx.fillStyle = 'rgba(80,60,120,0.9)';
        ctx.font = 'bold 11px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('A 区', startX + halfW / 2, seatsTop - 10);
        ctx.fillText('B 区', startX + halfW + aisleW + halfW / 2, seatsTop - 10);

        // 绘制座位
        for (let row = 1; row <= 13; row++) {
            const ry = seatsTop + (row - 1) * rowGap;
            const section = row <= 4 ? 'front' : row <= 9 ? 'middle' : 'back';
            const color = colors[section];

            // A区
            for (let s = 1; s <= halfCount; s++) {
                const sx2 = startX + (s - 1) * (seatW + seatGap);
                const isUser = userSeat && userSeat.zoneLetter === 'A' && userSeat.row === row && userSeat.seat === s;
                drawSeat(ctx, sx2, ry, seatW, seatH, color, isUser, pulse);
            }
            // 过道
            const ax = startX + halfW;
            ctx.fillStyle = 'rgba(180,190,200,0.3)';
            ctx.fillRect(ax + 1, ry, aisleW - 2, seatH);
            if (row === 6) {
                ctx.fillStyle = 'rgba(100,110,130,0.7)';
                ctx.font = '8px "PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('过道', ax + aisleW / 2, ry + seatH / 2 + 3);
            }
            // B区
            for (let s = 1; s <= halfCount; s++) {
                const sx2 = startX + halfW + aisleW + (s - 1) * (seatW + seatGap);
                const isUser = userSeat && userSeat.zoneLetter === 'B' && userSeat.row === row && userSeat.seat === s;
                drawSeat(ctx, sx2, ry, seatW, seatH, color, isUser, pulse);
            }
        }

        // 去除所有排数文字和分隔虚线，保持画面极简
    }

    // 缩放控制
    let scale = 1, offX = 0, offY = 0;
    const MIN_S = 0.5, MAX_S = 5;
    let lastPinch = 0, lastTx = 0, lastTy = 0, dragging = false;
    let animId = null, curSeat = null, pulseVal = 0;

    function updateZoomUI() { zoomPct.textContent = Math.round(scale * 100) + '%'; }

    function render() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const containerW = canvasCard.clientWidth;
        const containerH = canvasCard.clientHeight;
        // 计算适配容器的显示尺寸，保持宽高比并尽量填满
        const aspect = LW / LH;
        let displayW, displayH;
        if (containerW / containerH > aspect) {
            displayH = containerH;
            displayW = displayH * aspect;
        } else {
            displayW = containerW;
            displayH = displayW / aspect;
        }
        canvas.width = displayW * dpr;
        canvas.height = displayH * dpr;
        canvas.style.width = displayW + 'px';
        canvas.style.height = displayH + 'px';
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
        const baseScale = displayW / LW;
        ctx.save();
        ctx.translate(offX, offY);
        ctx.scale(baseScale * scale, baseScale * scale);
        drawAll(ctx, curSeat, pulseVal);
        ctx.restore();
    }

    function startAnim(seat) {
        curSeat = seat; scale = 1; offX = 0; offY = 0; updateZoomUI();
        if (animId) cancelAnimationFrame(animId);
        function loop(ts) { pulseVal = (ts / 700) * Math.PI * 2; render(); animId = requestAnimationFrame(loop); }
        animId = requestAnimationFrame(loop);
    }
    function stopAnim() { if (animId) { cancelAnimationFrame(animId); animId = null; } curSeat = null; }

    // 触摸事件
    function pinchDist(t1, t2) { return Math.sqrt((t1.clientX - t2.clientX) ** 2 + (t1.clientY - t2.clientY) ** 2); }
    canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        if (e.touches.length === 2) { dragging = false; lastPinch = pinchDist(e.touches[0], e.touches[1]); }
        else if (e.touches.length === 1) { dragging = true; lastTx = e.touches[0].clientX; lastTy = e.touches[0].clientY; }
    }, { passive: false });
    canvas.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (e.touches.length === 2) {
            dragging = false;
            const nd = pinchDist(e.touches[0], e.touches[1]);
            const rect = canvas.getBoundingClientRect();
            const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
            const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
            if (lastPinch > 0) {
                const r = nd / lastPinch;
                const ns = Math.min(MAX_S, Math.max(MIN_S, scale * r));
                offX = cx - (cx - offX) * (ns / scale);
                offY = cy - (cy - offY) * (ns / scale);
                scale = ns; updateZoomUI();
            }
            lastPinch = nd;
        } else if (e.touches.length === 1 && dragging) {
            offX += e.touches[0].clientX - lastTx;
            offY += e.touches[0].clientY - lastTy;
            lastTx = e.touches[0].clientX; lastTy = e.touches[0].clientY;
        }
    }, { passive: false });
    canvas.addEventListener('touchend', function(e) { if (e.touches.length === 0) { dragging = false; lastPinch = 0; } });
    canvas.addEventListener('wheel', function(e) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        const ns = Math.min(MAX_S, Math.max(MIN_S, scale * (e.deltaY > 0 ? 0.9 : 1.1)));
        offX = mx - (mx - offX) * (ns / scale); offY = my - (my - offY) * (ns / scale);
        scale = ns; updateZoomUI();
    }, { passive: false });

    document.getElementById('zoomInBtn').addEventListener('click', () => {
        const ns = Math.min(MAX_S, scale * 1.35);
        const dw = canvas.clientWidth, dh = canvas.clientHeight;
        offX = dw / 2 - (dw / 2 - offX) * (ns / scale);
        offY = dh / 2 - (dh / 2 - offY) * (ns / scale);
        scale = ns; updateZoomUI();
    });
    document.getElementById('zoomOutBtn').addEventListener('click', () => {
        const ns = Math.max(MIN_S, scale / 1.35);
        const dw = canvas.clientWidth, dh = canvas.clientHeight;
        offX = dw / 2 - (dw / 2 - offX) * (ns / scale);
        offY = dh / 2 - (dh / 2 - offY) * (ns / scale);
        scale = ns; updateZoomUI();
    });
    document.getElementById('zoomResetBtn').addEventListener('click', () => { scale = 1; offX = 0; offY = 0; updateZoomUI(); });

    // UI
    function buildBigInfoHTML(seat) {
        const sc = seat.section;
        const st = sc === 'front' ? '前排' : sc === 'middle' ? '中排' : '后排';
        return `<div class="seat-zone-display"><span class="zone-badge ${sc}">${seat.zoneLetter}</span><span class="zone-text">${seat.zoneLetter}区 · ${st}</span></div><div class="seat-detail-row"><span class="seat-detail-item">第 ${seat.row} 排</span><span class="seat-detail-divider">·</span><span class="seat-detail-item">第 ${seat.seat} 座</span></div><span class="seat-code">🏷️ 编号：${seat.code}</span>`;
    }
    function showError(msg) {
        errorMessage.textContent = msg; errorMessage.classList.add('show');
        nameInput.style.borderColor = 'rgba(255,138,138,0.9)';
        setTimeout(() => { errorMessage.classList.remove('show'); nameInput.style.borderColor = 'rgba(255,255,255,0.35)'; }, 2000);
    }
    function showPage(p) { [pageHome, pageResult].forEach(x => x.classList.add('hidden')); p.classList.remove('hidden'); }

    function showResult(name, seat) {
        displayName.textContent = name.trim();
        seatBigInfo.innerHTML = buildBigInfoHTML(seat);
        showPage(pageResult);
        startAnim(seat);
        const url = new URL(window.location); url.searchParams.set('name', name.trim());
        history.pushState(null, '', url.toString());
        pageResult.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    btnFindSeat.addEventListener('click', () => {
        const name = nameInput.value.trim();
        if (!name) { showError('请输入姓名'); return; }
        const seat = getSeatByName(name);
        if (!seat) { showError('未找到对应座位，请重试'); return; }
        showResult(name, seat);
    });
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); btnFindSeat.click(); } });
    btnBack.addEventListener('click', () => { stopAnim(); showPage(pageHome); nameInput.focus(); if (window.location.search.includes('name=')) history.pushState(null, '', window.location.pathname); });

    window.addEventListener('popstate', () => {
        const p = new URLSearchParams(window.location.search);
        const nm = p.get('name');
        if (nm && nm.trim()) { const seat = getSeatByName(nm); if (seat) { showResult(nm, seat); return; } }
        stopAnim(); showPage(pageHome); nameInput.focus();
    });

    function init() {
        const p = new URLSearchParams(window.location.search);
        const nm = p.get('name');
        if (nm && nm.trim()) { const seat = getSeatByName(nm); if (seat) { showResult(nm, seat); return; } }
        showPage(pageHome); nameInput.focus();
    }
    init();
})();
</script>
</body>
</html>
