<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>座位导航 · 左海产业生态大会</title>
    <style>
        :root {
            --card-max-width: 400px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .bg-fixed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('背景.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', system-ui, sans-serif;
            background-color: #4c1d95;
            color: #f0eaff;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2vw;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .page {
            width: 100%;
            display: flex;
            justify-content: center;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .page.hidden {
            display: none;
            opacity: 0;
            transform: translateY(12px);
        }
        .page.active {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        .glass-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4vw;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            padding: 4vw 3.5vw;
            text-align: center;
        }

        /* 首页 */
        .home-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 3vw;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
        .home-icon svg {
            width: 28px;
            height: 28px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .home-title {
            font-size: 5.2vw;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
            margin-bottom: 1.5vw;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        .home-subtitle {
            font-size: 3.4vw;
            color: rgba(255, 255, 255, 0.78);
            margin-bottom: 5vw;
        }

        .input-wrap {
            position: relative;
            margin-bottom: 2vw;
        }
        .input-wrap input {
            width: 100%;
            padding: 3.5vw 9vw 3.5vw 3.5vw;
            font-size: 3.8vw;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 10vw;
            outline: none;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            text-align: center;
            letter-spacing: 0.5px;
            transition: background 0.2s, border-color 0.2s;
        }
        .input-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        .input-wrap input:focus {
            border-color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.22);
        }
        .input-icon {
            position: absolute;
            right: 3.5vw;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: rgba(255, 255, 255, 0.55);
            width: 4vw;
            height: 4vw;
        }

        .error-message {
            display: block;
            height: 4vw;
            line-height: 4vw;
            font-size: 3vw;
            color: #ffaaaa;
            margin-bottom: 2vw;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .error-message.show {
            opacity: 1;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 2vw;
            padding: 3.5vw 5vw;
            font-size: 4vw;
            font-weight: 600;
            border: none;
            border-radius: 10vw;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            outline: none;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            color: #5b21b6;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
            touch-action: manipulation;
        }
        .btn:active {
            transform: scale(0.97);
            background: #fff;
        }
        .btn-outline {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            width: auto;
            padding: 2vw 4vw;
            font-size: 3.2vw;
            border-radius: 8vw;
            box-shadow: none;
        }
        .btn-zoom {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 1.5vw 3vw;
            font-size: 3.2vw;
            border-radius: 6vw;
            flex: 0 0 auto;
            min-width: 8vw;
            text-align: center;
        }
        .btn-zoom-row {
            display: flex;
            gap: 2vw;
            justify-content: center;
            align-items: center;
            margin-top: 2vw;
            flex-wrap: wrap;
        }
        .zoom-indicator {
            color: rgba(255, 255, 255, 0.7);
            font-size: 2.8vw;
            min-width: 12vw;
            text-align: center;
        }
        .home-hint {
            margin-top: 2.5vw;
            font-size: 2.8vw;
            color: rgba(255, 255, 255, 0.5);
        }

        /* 结果页 */
        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 3vw;
        }
        .result-greeting {
            font-size: 4.2vw;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }
        .result-greeting .name-em {
            color: #fff;
            font-weight: 800;
        }

        .seat-big-info {
            margin: 3vw 0;
            padding: 4vw 3vw;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3vw;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .seat-zone-display {
            display: inline-flex;
            align-items: center;
            gap: 2.5vw;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 8vw;
            padding: 2vw 4vw;
            margin-bottom: 2.5vw;
            border: 1px solid rgba(255, 255, 255, 0.22);
        }
        .zone-badge {
            width: 9vw;
            height: 9vw;
            max-width: 40px;
            max-height: 40px;
            border-radius: 50%;
            font-size: 4.5vw;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .zone-badge.front {
            background: #e8963a;
        }
        .zone-badge.middle {
            background: #3d7ec5;
        }
        .zone-badge.back {
            background: #4a9d6e;
        }
        .zone-text {
            font-size: 3.6vw;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            text-align: left;
        }
        .seat-detail-row {
            display: flex;
            flex-wrap: wrap;
            gap: 2.5vw;
            justify-content: center;
            align-items: center;
            margin: 1vw 0;
        }
        .seat-detail-item {
            font-size: 5.5vw;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }
        .seat-detail-divider {
            font-size: 3.5vw;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
        }
        .seat-code {
            font-size: 3.5vw;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.12);
            padding: 1.5vw 4vw;
            border-radius: 5vw;
            letter-spacing: 1px;
            margin-top: 1.5vw;
            display: inline-block;
        }

        /* Canvas容器 */
        .canvas-wrapper {
            margin: 3vw 0 1vw;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 2.5vw;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.25);
            position: relative;
            touch-action: none;
            cursor: grab;
        }
        .canvas-wrapper:active {
            cursor: grabbing;
        }
        .canvas-wrapper canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        /* 图例 */
        .legend-row {
            display: flex;
            flex-wrap: wrap;
            gap: 2.5vw;
            justify-content: center;
            align-items: center;
            font-size: 2.6vw;
            color: rgba(255, 255, 255, 0.7);
            padding: 1vw 0;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 1.2vw;
        }
        .legend-dot {
            width: 2.8vw;
            height: 2.8vw;
            border-radius: 4px;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.35);
        }
        .legend-dot.front-seat {
            background: #f5d4a8;
        }
        .legend-dot.middle-seat {
            background: #b3d1f0;
        }
        .legend-dot.back-seat {
            background: #b8ddc4;
        }
        .legend-dot.lead-seat {
            background: #d5cde0;
        }
        .legend-dot.your-seat {
            background: #e8455b;
            border: 2px solid #c0392b;
            box-shadow: 0 0 6px rgba(232, 69, 91, 0.5);
        }

        @media (max-width: 360px) {
            .home-title {
                font-size: 5.8vw;
            }
            .home-subtitle {
                font-size: 3.8vw;
            }
            .input-wrap input {
                padding: 4vw 11vw 4vw 4vw;
                font-size: 4vw;
            }
            .btn {
                padding: 4vw 6vw;
                font-size: 4.2vw;
            }
            .seat-detail-item {
                font-size: 6vw;
            }
            .zone-text {
                font-size: 4vw;
            }
            .legend-row {
                font-size: 2.8vw;
                gap: 2vw;
            }
            .btn-zoom {
                padding: 2vw 3.5vw;
                font-size: 3.5vw;
            }
            .zoom-indicator {
                font-size: 3vw;
            }
        }

        @media (min-width: 400px) {
            .glass-card {
                border-radius: 16px;
                padding: 22px 18px;
            }
            .home-title {
                font-size: 1.22rem;
            }
            .home-subtitle {
                font-size: 0.8rem;
            }
            .input-wrap input {
                padding: 13px 38px 13px 14px;
                font-size: 0.88rem;
            }
            .btn {
                padding: 13px 24px;
                font-size: 0.88rem;
            }
            .seat-detail-item {
                font-size: 1.35rem;
            }
            .zone-text {
                font-size: 0.82rem;
            }
            .error-message {
                height: 18px;
                line-height: 18px;
                font-size: 0.68rem;
            }
            .legend-row {
                font-size: 0.7rem;
                gap: 10px;
            }
            .legend-dot {
                width: 10px;
                height: 10px;
            }
            .canvas-wrapper {
                border-radius: 10px;
            }
            .btn-zoom {
                padding: 6px 12px;
                font-size: 0.8rem;
                border-radius: 20px;
            }
            .zoom-indicator {
                font-size: 0.75rem;
                min-width: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-fixed"></div>
    <div class="app-container">
        <!-- 首页 -->
        <div class="page active" id="page-home">
            <div class="glass-card">
                <div class="home-icon">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="5" width="18" height="2.5" rx="1" />
                        <rect x="5.5" y="10" width="3.5" height="3.5" rx="0.8" />
                        <rect x="11" y="10" width="3.5" height="3.5" rx="0.8" />
                        <rect x="16.5" y="10" width="3.5" height="3.5" rx="0.8" />
                        <rect x="5.5" y="16" width="3.5" height="3.5" rx="0.8" />
                        <rect x="11" y="16" width="5" height="3.5" rx="0.8" fill="currentColor" stroke="none" opacity="0.35" />
                        <circle cx="13.5" cy="17.75" r="1" fill="#fff" />
                    </svg>
                </div>
                <h1 class="home-title">座位导航</h1>
                <p class="home-subtitle">输入姓名，查看您的座位</p>
                <div class="input-wrap">
                    <input type="text" id="nameInput" placeholder="请输入姓名" autocomplete="name" maxlength="30" aria-label="姓名输入框">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2" />
                    </svg>
                </div>
                <span class="error-message" id="errorMessage">请输入姓名</span>
                <button class="btn" id="btnFindSeat" type="button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:4vw;height:4vw;">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    查找座位
                </button>
                <p class="home-hint">试试输入"张三"或"李小明"</p>
            </div>
        </div>

        <!-- 二级页面 -->
        <div class="page hidden" id="page-result">
            <div class="glass-card">
                <div class="result-header">
                    <div class="result-greeting">
                        👋 <span class="name-em" id="displayName">---</span> 的座位
                    </div>
                    <button class="btn btn-outline" id="btnBack" type="button">← 返回</button>
                </div>
                <div class="seat-big-info" id="seatBigInfo"></div>

                <!-- 缩放提示 -->
                <div style="font-size:2.6vw;color:rgba(255,255,255,0.5);margin-bottom:1vw;">
                    👆 双指缩放 · 单指拖动查看全图
                </div>

                <!-- 全局座位示意图 -->
                <div class="canvas-wrapper" id="canvasWrapper">
                    <canvas id="seatCanvas" aria-label="全局座位示意图"></canvas>
                </div>

                <!-- 缩放按钮 -->
                <div class="btn-zoom-row">
                    <button class="btn-zoom" id="zoomOutBtn" type="button">−</button>
                    <span class="zoom-indicator" id="zoomIndicator">100%</span>
                    <button class="btn-zoom" id="zoomInBtn" type="button">+</button>
                    <button class="btn-zoom" id="zoomResetBtn" type="button" style="margin-left:2vw;">↺ 重置</button>
                </div>

                <!-- 图例 -->
                <div class="legend-row" style="margin-top:2vw;">
                    <span class="legend-item"><span class="legend-dot lead-seat"></span> 主席台</span>
                    <span class="legend-item"><span class="legend-dot front-seat"></span> 前排</span>
                    <span class="legend-item"><span class="legend-dot middle-seat"></span> 中排</span>
                    <span class="legend-item"><span class="legend-dot back-seat"></span> 后排</span>
                    <span class="legend-item"><span class="legend-dot your-seat"></span> 您的座位</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ============ DOM ============
            const pageHome = document.getElementById('page-home');
            const pageResult = document.getElementById('page-result');
            const nameInput = document.getElementById('nameInput');
            const btnFindSeat = document.getElementById('btnFindSeat');
            const btnBack = document.getElementById('btnBack');
            const displayName = document.getElementById('displayName');
            const seatBigInfo = document.getElementById('seatBigInfo');
            const errorMessage = document.getElementById('errorMessage');
            const canvas = document.getElementById('seatCanvas');
            const canvasWrapper = document.getElementById('canvasWrapper');
            const ctx = canvas.getContext('2d');
            const zoomIndicator = document.getElementById('zoomIndicator');

            // ============ 座位数据 ============
            const allSeats = [];
            for (let row = 1; row <= 13; row++) {
                let section = row <= 4 ? 'front' : row <= 9 ? 'middle' : 'back';
                for (let seat = 1; seat <= 10; seat++) {
                    allSeats.push({ zoneLetter: 'A', row, seat, section, code: `A${row}-${seat}` });
                    allSeats.push({ zoneLetter: 'B', row, seat, section, code: `B${row}-${seat}` });
                }
            }
            const totalGuestSeats = allSeats.length;

            function hashString(str) {
                let hash = 5381;
                for (let i = 0; i < str.length; i++) {
                    hash = ((hash << 5) + hash) + str.charCodeAt(i);
                    hash = hash & 0x7fffffff;
                }
                return hash;
            }

            function getSeatByName(name) {
                const trimmed = name.trim();
                if (!trimmed) return null;
                return allSeats[hashString(trimmed) % totalGuestSeats];
            }

            // ============ Canvas 缩放状态 ============
            const LOGICAL_W = 600;
            const LOGICAL_H = 480;

            // 变换状态
            let scale = 1;
            let offsetX = 0;
            let offsetY = 0;
            const MIN_SCALE = 0.5;
            const MAX_SCALE = 4;

            // 触摸状态
            let touches = {};
            let lastPinchDist = 0;
            let lastPinchCenter = { x: 0, y: 0 };
            let lastSingleTouch = { x: 0, y: 0 };
            let isDragging = false;

            // ============ Canvas 绘制函数 ============
            const seatW = 16;
            const seatH = 13;
            const seatGap = 2;
            const aisleW = 52;
            const rowGap = 18;
            const halfCount = 10;
            const halfBlockW = halfCount * seatW + (halfCount - 1) * seatGap;

            const stageY = 6;
            const stageH = 24;
            const stageW = 360;

            const leadY = 40;
            const leadRows = 3;
            const leadSeatsPerRow = 10;
            const leadSeatW = 14;
            const leadSeatH = 11;
            const leadSeatGap = 2;
            const leadRowGap = 15;
            const leadBlockW = leadSeatsPerRow * leadSeatW + (leadSeatsPerRow - 1) * leadSeatGap;

            const guestStartY = 100;

            const colors = {
                front: { fill: '#f5d4a8', stroke: '#d4944a' },
                middle: { fill: '#b3d1f0', stroke: '#4a7db5' },
                back: { fill: '#b8ddc4', stroke: '#4a8d60' }
            };

            function getSectionColor(section) {
                return colors[section];
            }

            function drawRoundedRect(ctx, x, y, w, h, r) {
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
            }

            function drawStage(ctx, cx) {
                const sx = cx - stageW / 2;
                const sy = stageY;
                const grad = ctx.createLinearGradient(sx, sy, sx, sy + stageH);
                grad.addColorStop(0, '#5a5d6e');
                grad.addColorStop(0.5, '#3a3d4a');
                grad.addColorStop(1, '#2a2d38');
                ctx.fillStyle = grad;
                drawRoundedRect(ctx, sx, sy, stageW, stageH, 5);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.06)';
                drawRoundedRect(ctx, sx + 12, sy + 3, stageW - 24, stageH / 2 - 1, 3);
                ctx.fill();
                ctx.fillStyle = '#e8eaf0';
                ctx.font = 'bold 12px "PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('舞 台', cx, sy - 5);
                ctx.strokeStyle = '#c8ccd6';
                ctx.lineWidth = 0.7;
                ctx.setLineDash([4, 5]);
                ctx.beginPath();
                ctx.moveTo(sx - 60, sy + stageH / 2);
                ctx.lineTo(sx - 5, sy + stageH / 2);
                ctx.moveTo(sx + stageW + 5, sy + stageH / 2);
                ctx.lineTo(sx + stageW + 60, sy + stageH / 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            function drawLeadSeats(ctx, cx) {
                const lx = cx - leadBlockW / 2;
                const ly = leadY;
                for (let r = 0; r < leadRows; r++) {
                    const ry = ly + r * leadRowGap;
                    for (let s = 0; s < leadSeatsPerRow; s++) {
                        const sx = lx + s * (leadSeatW + leadSeatGap);
                        ctx.fillStyle = '#e0d8ea';
                        drawRoundedRect(ctx, sx, ry, leadSeatW, leadSeatH, 3);
                        ctx.fill();
                        ctx.strokeStyle = '#b0a0be';
                        ctx.lineWidth = 0.6;
                        drawRoundedRect(ctx, sx, ry, leadSeatW, leadSeatH, 3);
                        ctx.stroke();
                        ctx.fillStyle = 'rgba(255,255,255,0.3)';
                        drawRoundedRect(ctx, sx + 3, ry + 2, leadSeatW - 6, leadSeatH / 2 - 1, 2);
                        ctx.fill();
                    }
                }
                ctx.fillStyle = '#c8bfd4';
                ctx.font = '9px "PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('主席台（领导席·30人）', cx, ly - 7);
            }

            function drawOneSeat(ctx, x, y, w, h, colors, isUser, pulse) {
                if (isUser) {
                    const glowSize = 5 + 3 * Math.sin(pulse);
                    ctx.save();
                    ctx.shadowColor = 'rgba(232,69,91,0.85)';
                    ctx.shadowBlur = 8 + glowSize;
                    ctx.fillStyle = '#e8455b';
                    drawRoundedRect(ctx, x, y, w, h, 3);
                    ctx.fill();
                    ctx.restore();
                    const grad = ctx.createLinearGradient(x, y, x, y + h);
                    grad.addColorStop(0, '#ff5c72');
                    grad.addColorStop(1, '#d63850');
                    ctx.fillStyle = grad;
                    drawRoundedRect(ctx, x, y, w, h, 3);
                    ctx.fill();
                    ctx.strokeStyle = '#a02030';
                    ctx.lineWidth = 2;
                    drawRoundedRect(ctx, x, y, w, h, 3);
                    ctx.stroke();
                    const mx = x + w / 2;
                    const my = y + h / 2;
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 1.4;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(mx - 3, my);
                    ctx.lineTo(mx - 0.5, my + 2.5);
                    ctx.lineTo(mx + 3, my - 2.5);
                    ctx.stroke();
                    ctx.lineCap = 'butt';
                } else {
                    ctx.fillStyle = colors.fill;
                    drawRoundedRect(ctx, x, y, w, h, 3);
                    ctx.fill();
                    ctx.strokeStyle = colors.stroke;
                    ctx.lineWidth = 0.7;
                    drawRoundedRect(ctx, x, y, w, h, 3);
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    drawRoundedRect(ctx, x + 3, y + 2, w - 6, h / 2 - 1, 2);
                    ctx.fill();
                }
            }

            function drawAll(ctx, userSeat, pulse) {
                ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);
                ctx.fillStyle = 'rgba(22,16,38,0.3)';
                ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

                const cx = LOGICAL_W / 2;
                const groupW = halfBlockW * 2 + aisleW;
                const startX = cx - groupW / 2;

                drawStage(ctx, cx);
                drawLeadSeats(ctx, cx);

                // 嘉宾席
                for (let row = 1; row <= 13; row++) {
                    const ry = guestStartY + (row - 1) * rowGap;
                    let section = row <= 4 ? 'front' : row <= 9 ? 'middle' : 'back';
                    const clr = getSectionColor(section);

                    // A区
                    for (let s = 1; s <= halfCount; s++) {
                        const sx = startX + (s - 1) * (seatW + seatGap);
                        const isUser = userSeat && userSeat.zoneLetter === 'A' && userSeat.row === row && userSeat
                            .seat === s;
                        drawOneSeat(ctx, sx, ry, seatW, seatH, clr, isUser, pulse);
                    }

                    // 过道
                    const ax = startX + halfBlockW;
                    ctx.fillStyle = 'rgba(180,190,200,0.3)';
                    ctx.fillRect(ax + 1, ry, aisleW - 2, seatH);
                    if (row === 6) {
                        ctx.fillStyle = 'rgba(200,210,220,0.7)';
                        ctx.font = '8px "PingFang SC","Microsoft YaHei",sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('过 道', ax + aisleW / 2, ry + seatH / 2 + 3);
                    }

                    // B区
                    for (let s = 1; s <= halfCount; s++) {
                        const sx = startX + halfBlockW + aisleW + (s - 1) * (seatW + seatGap);
                        const isUser = userSeat && userSeat.zoneLetter === 'B' && userSeat.row === row && userSeat
                            .seat === s;
                        drawOneSeat(ctx, sx, ry, seatW, seatH, clr, isUser, pulse);
                    }
                }

                // 分区标签
                ctx.fillStyle = 'rgba(255,255,255,0.75)';
                ctx.font = 'bold 10px "PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('A区', startX + halfBlockW / 2, guestStartY - 10);
                ctx.fillText('B区', startX + halfBlockW + aisleW + halfBlockW / 2, guestStartY - 10);

                const labelX = 12;
                ctx.font = '8px "PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'left';
                const frontLabelY = guestStartY + 2 * rowGap;
                const middleLabelY = guestStartY + 7 * rowGap;
                const backLabelY = guestStartY + 11.5 * rowGap;
                ctx.fillStyle = 'rgba(240,160,75,0.9)';
                ctx.fillText('前排 1~4排', labelX, frontLabelY);
                ctx.fillStyle = 'rgba(74,144,217,0.9)';
                ctx.fillText('中排 5~9排', labelX, middleLabelY);
                ctx.fillStyle = 'rgba(91,168,125,0.9)';
                ctx.fillText('后排 10~13排', labelX, backLabelY);

                // 分隔虚线
                ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                ctx.lineWidth = 0.6;
                ctx.setLineDash([5, 6]);
                [guestStartY + 4 * rowGap - 1, guestStartY + 9 * rowGap - 1].forEach(sy => {
                    ctx.beginPath();
                    ctx.moveTo(15, sy);
                    ctx.lineTo(LOGICAL_W - 15, sy);
                    ctx.stroke();
                });
                ctx.setLineDash([]);

                // 控台
                const cy = guestStartY + 13 * rowGap + 14;
                ctx.fillStyle = 'rgba(180,185,200,0.35)';
                drawRoundedRect(ctx, cx - 110, cy, 220, 22, 5);
                ctx.fill();
                ctx.fillStyle = 'rgba(210,215,225,0.75)';
                ctx.font = '9px "PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('控台工作区', cx, cy + 15);
            }

            // ============ 渲染循环 ============
            let animId = null;
            let currentSeat = null;
            let pulseVal = 0;
            let needsRedraw = true;

            function renderToCanvas() {
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = canvasWrapper.clientWidth * dpr;
                canvas.height = (canvasWrapper.clientWidth * LOGICAL_H / LOGICAL_W) * dpr;
                canvas.style.width = canvasWrapper.clientWidth + 'px';
                canvas.style.height = (canvasWrapper.clientWidth * LOGICAL_H / LOGICAL_W) + 'px';
                ctx.scale(dpr, dpr);

                // 应用缩放平移
                const displayW = canvasWrapper.clientWidth;
                const baseScale = displayW / LOGICAL_W;
                const totalScale = baseScale * scale;

                ctx.save();
                ctx.translate(offsetX, offsetY);
                ctx.scale(totalScale, totalScale);
                drawAll(ctx, currentSeat, pulseVal);
                ctx.restore();
            }

            function startAnimation(userSeat) {
                currentSeat = userSeat;
                // 重置缩放
                scale = 1;
                offsetX = 0;
                offsetY = 0;
                updateZoomIndicator();
                if (animId) cancelAnimationFrame(animId);

                function loop(ts) {
                    pulseVal = (ts / 700) * Math.PI * 2;
                    renderToCanvas();
                    animId = requestAnimationFrame(loop);
                }
                animId = requestAnimationFrame(loop);
            }

            function stopAnimation() {
                if (animId) { cancelAnimationFrame(animId);
                    animId = null; }
                currentSeat = null;
            }

            function updateZoomIndicator() {
                zoomIndicator.textContent = Math.round(scale * 100) + '%';
            }

            // ============ 触摸事件（缩放+平移）============
            function getCanvasPos(e) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            }

            function getPinchDistance(t1, t2) {
                const dx = t1.clientX - t2.clientX;
                const dy = t1.clientY - t2.clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }

            function getPinchCenter(t1, t2) {
                return {
                    x: (t1.clientX + t2.clientX) / 2,
                    y: (t1.clientY + t2.clientY) / 2
                };
            }

            canvas.addEventListener('touchstart', function(e) {
                e.preventDefault();
                const touchesList = e.touches;
                if (touchesList.length === 2) {
                    // 双指开始
                    isDragging = false;
                    lastPinchDist = getPinchDistance(touchesList[0], touchesList[1]);
                    lastPinchCenter = getPinchCenter(touchesList[0], touchesList[1]);
                } else if (touchesList.length === 1) {
                    // 单指开始
                    isDragging = true;
                    lastSingleTouch = {
                        x: touchesList[0].clientX,
                        y: touchesList[0].clientY
                    };
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', function(e) {
                e.preventDefault();
                const touchesList = e.touches;
                if (touchesList.length === 2) {
                    // 双指缩放
                    isDragging = false;
                    const newDist = getPinchDistance(touchesList[0], touchesList[1]);
                    const newCenter = getPinchCenter(touchesList[0], touchesList[1]);
                    if (lastPinchDist > 0) {
                        const ratio = newDist / lastPinchDist;
                        const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * ratio));

                        // 以双指中心为缩放原点
                        const rect = canvas.getBoundingClientRect();
                        const cx = newCenter.x - rect.left;
                        const cy = newCenter.y - rect.top;

                        offsetX = cx - (cx - offsetX) * (newScale / scale);
                        offsetY = cy - (cy - offsetY) * (newScale / scale);
                        scale = newScale;
                        updateZoomIndicator();
                    }
                    lastPinchDist = newDist;
                    lastPinchCenter = newCenter;
                } else if (touchesList.length === 1 && isDragging) {
                    // 单指拖动
                    const dx = touchesList[0].clientX - lastSingleTouch.x;
                    const dy = touchesList[0].clientY - lastSingleTouch.y;
                    offsetX += dx;
                    offsetY += dy;
                    lastSingleTouch = {
                        x: touchesList[0].clientX,
                        y: touchesList[0].clientY
                    };
                }
            }, { passive: false });

            canvas.addEventListener('touchend', function(e) {
                if (e.touches.length === 0) {
                    isDragging = false;
                    lastPinchDist = 0;
                } else if (e.touches.length === 1) {
                    isDragging = true;
                    lastSingleTouch = {
                        x: e.touches[0].clientX,
                        y: e.touches[0].clientY
                    };
                }
            });

            // 鼠标滚轮缩放（桌面调试）
            canvas.addEventListener('wheel', function(e) {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * delta));
                offsetX = mx - (mx - offsetX) * (newScale / scale);
                offsetY = my - (my - offsetY) * (newScale / scale);
                scale = newScale;
                updateZoomIndicator();
            }, { passive: false });

            // 缩放按钮
            document.getElementById('zoomInBtn').addEventListener('click', function() {
                const newScale = Math.min(MAX_SCALE, scale * 1.3);
                const displayW = canvasWrapper.clientWidth;
                const displayH = canvasWrapper.clientWidth * LOGICAL_H / LOGICAL_W;
                const cx = displayW / 2;
                const cy = displayH / 2;
                offsetX = cx - (cx - offsetX) * (newScale / scale);
                offsetY = cy - (cy - offsetY) * (newScale / scale);
                scale = newScale;
                updateZoomIndicator();
            });
            document.getElementById('zoomOutBtn').addEventListener('click', function() {
                const newScale = Math.max(MIN_SCALE, scale / 1.3);
                const displayW = canvasWrapper.clientWidth;
                const displayH = canvasWrapper.clientWidth * LOGICAL_H / LOGICAL_W;
                const cx = displayW / 2;
                const cy = displayH / 2;
                offsetX = cx - (cx - offsetX) * (newScale / scale);
                offsetY = cy - (cy - offsetY) * (newScale / scale);
                scale = newScale;
                updateZoomIndicator();
            });
            document.getElementById('zoomResetBtn').addEventListener('click', function() {
                scale = 1;
                offsetX = 0;
                offsetY = 0;
                updateZoomIndicator();
            });

            // ============ 窗口resize ============
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (currentSeat) {
                        renderToCanvas();
                    }
                }, 200);
            });

            // ============ UI逻辑 ============
            function buildBigInfoHTML(seat) {
                const sectionClass = seat.section;
                const sectionText = seat.section === 'front' ? '前排' : seat.section === 'middle' ? '中排' : '后排';
                return `
                    <div class="seat-zone-display">
                        <span class="zone-badge ${sectionClass}">${seat.zoneLetter}</span>
                        <span class="zone-text">${seat.zoneLetter}区 · ${sectionText}</span>
                    </div>
                    <div class="seat-detail-row">
                        <span class="seat-detail-item">第 ${seat.row} 排</span>
                        <span class="seat-detail-divider">·</span>
                        <span class="seat-detail-item">第 ${seat.seat} 座</span>
                    </div>
                    <span class="seat-code">🏷️ 编号：${seat.code}</span>
                `;
            }

            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.classList.add('show');
                nameInput.style.borderColor = 'rgba(255,138,138,0.9)';
                setTimeout(() => {
                    errorMessage.classList.remove('show');
                    nameInput.style.borderColor = 'rgba(255,255,255,0.35)';
                }, 2000);
            }

            function showHome() {
                stopAnimation();
                pageResult.classList.add('hidden');
                pageResult.classList.remove('active');
                pageHome.classList.remove('hidden');
                pageHome.classList.add('active');
                nameInput.focus();
                if (window.location.search.includes('name=')) {
                    history.pushState(null, '', window.location.pathname);
                }
            }

            function showResult(name, seat) {
                pageHome.classList.add('hidden');
                pageHome.classList.remove('active');
                pageResult.classList.remove('hidden');
                pageResult.classList.add('active');
                displayName.textContent = name.trim();
                seatBigInfo.innerHTML = buildBigInfoHTML(seat);
                startAnimation(seat);
                const url = new URL(window.location);
                url.searchParams.set('name', name.trim());
                history.pushState(null, '', url.toString());
                pageResult.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            function handleFind() {
                const name = nameInput.value.trim();
                if (!name) { showError('请输入姓名'); return; }
                const seat = getSeatByName(name);
                if (!seat) { showError('未找到对应座位，请重试'); return; }
                showResult(name, seat);
            }

            btnFindSeat.addEventListener('click', handleFind);
            nameInput.addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault();
                    handleFind(); }
            });
            btnBack.addEventListener('click', e => { e.preventDefault();
                showHome(); });

            window.addEventListener('popstate', () => {
                const params = new URLSearchParams(window.location.search);
                const nameParam = params.get('name');
                if (nameParam && nameParam.trim()) {
                    const seat = getSeatByName(nameParam);
                    if (seat) {
                        stopAnimation();
                        pageHome.classList.add('hidden');
                        pageHome.classList.remove('active');
                        pageResult.classList.remove('hidden');
                        pageResult.classList.add('active');
                        displayName.textContent = nameParam.trim();
                        seatBigInfo.innerHTML = buildBigInfoHTML(seat);
                        startAnimation(seat);
                        return;
                    }
                }
                showHome();
            });

            function init() {
                const params = new URLSearchParams(window.location.search);
                const nameParam = params.get('name');
                if (nameParam && nameParam.trim()) {
                    const seat = getSeatByName(nameParam);
                    if (seat) {
                        pageHome.classList.add('hidden');
                        pageHome.classList.remove('active');
                        pageResult.classList.remove('hidden');
                        pageResult.classList.add('active');
                        displayName.textContent = nameParam.trim();
                        seatBigInfo.innerHTML = buildBigInfoHTML(seat);
                        startAnimation(seat);
                        return;
                    }
                }
                showHome();
                nameInput.focus();
            }
            init();
        })();
    </script>
</body>
