<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>座位导航 · 左海产业生态大会</title>
    <style>
        :root {
            --card-max-width: 400px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .bg-fixed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('背景.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', system-ui, sans-serif;
            background-color: #3c1a6e;
            color: #f0eaff;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2vw;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .page {
            width: 100%;
            display: flex;
            justify-content: center;
            transition: opacity 0.35s ease;
        }
        .page.hidden {
            display: none !important;
        }
        .page.active {
            display: flex;
        }

        .glass-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 3.5vw;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.18);
            padding: 4vw 3.5vw;
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        /* 首页 */
        .home-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 2.5vw;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.28);
        }
        .home-icon svg {
            width: 28px;
            height: 28px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .home-title {
            font-size: 5vw;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
            margin-bottom: 1.2vw;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        .home-subtitle {
            font-size: 3.2vw;
            color: rgba(255, 255, 255, 0.78);
            margin-bottom: 5vw;
        }
        .input-wrap {
            position: relative;
            margin-bottom: 1.5vw;
        }
        .input-wrap input {
            width: 100%;
            padding: 3.4vw 8vw 3.4vw 3.4vw;
            font-size: 3.6vw;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 10vw;
            outline: none;
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            text-align: center;
            letter-spacing: 0.5px;
            transition: background 0.2s, border-color 0.2s;
        }
        .input-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        .input-wrap input:focus {
            border-color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.24);
        }
        .input-icon {
            position: absolute;
            right: 3.2vw;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: rgba(255, 255, 255, 0.55);
            width: 3.8vw;
            height: 3.8vw;
        }
        .error-message {
            display: block;
            height: 4vw;
            line-height: 4vw;
            font-size: 2.8vw;
            color: #ffaaaa;
            margin-bottom: 1.5vw;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .error-message.show {
            opacity: 1;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 2vw;
            padding: 3.4vw 5vw;
            font-size: 3.8vw;
            font-weight: 600;
            border: none;
            border-radius: 10vw;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            outline: none;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            color: #5b21b6;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.14);
            touch-action: manipulation;
        }
        .btn:active {
            transform: scale(0.97);
            background: #fff;
        }
        .btn-outline-sm {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            width: auto;
            padding: 2vw 3.5vw;
            font-size: 3vw;
            border-radius: 7vw;
            box-shadow: none;
        }

        /* 结果页 */
        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2.5vw;
        }
        .result-greeting {
            font-size: 4vw;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }
        .result-greeting .name-em {
            color: #fff;
            font-weight: 800;
        }

        .seat-big-info {
            margin: 2.5vw 0;
            padding: 3.5vw 3vw;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2.5vw;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .seat-zone-display {
            display: inline-flex;
            align-items: center;
            gap: 2.2vw;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 7vw;
            padding: 1.8vw 3.5vw;
            margin-bottom: 2vw;
            border: 1px solid rgba(255, 255, 255, 0.22);
        }
        .zone-badge {
            width: 8.5vw;
            height: 8.5vw;
            max-width: 36px;
            max-height: 36px;
            border-radius: 50%;
            font-size: 4.2vw;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .zone-badge.front {
            background: #c98a3a;
        }
        .zone-badge.middle {
            background: #3b72b5;
        }
        .zone-badge.back {
            background: #4a9068;
        }
        .zone-text {
            font-size: 3.4vw;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            text-align: left;
        }
        .seat-detail-row {
            display: flex;
            flex-wrap: wrap;
            gap: 2.2vw;
            justify-content: center;
            align-items: center;
            margin: 1vw 0;
        }
        .seat-detail-item {
            font-size: 5.2vw;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }
        .seat-detail-divider {
            font-size: 3.2vw;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
        }
        .seat-code {
            font-size: 3.2vw;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.12);
            padding: 1.3vw 3.5vw;
            border-radius: 4.5vw;
            letter-spacing: 1px;
            margin-top: 1.2vw;
            display: inline-block;
        }
        .btn-map {
            margin-top: 2.5vw;
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 2.5vw 4vw;
            font-size: 3.5vw;
            border-radius: 8vw;
            width: 100%;
            font-weight: 600;
        }
        .btn-map:active {
            background: rgba(255, 255, 255, 0.4);
        }

        /* 图片三级页面 */
        .image-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 5, 20, 0.95);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }
        .image-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 3vw 4vw;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            z-index: 10;
        }
        .btn-image-back {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 2vw 4vw;
            border-radius: 6vw;
            font-size: 3.2vw;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-image-back:active {
            background: rgba(255, 255, 255, 0.4);
        }
        .image-viewer-container {
            flex: 1;
            width: 100%;
            position: relative;
            overflow: hidden;
            touch-action: none;
        }
        .image-viewer-container img {
            position: absolute;
            max-width: none;
            max-height: none;
            transform-origin: 0 0;
            pointer-events: none;
        }

        @media (max-width: 360px) {
            .home-title {
                font-size: 5.5vw;
            }
        }
        @media (min-width: 420px) {
            .glass-card {
                border-radius: 16px;
                padding: 22px 18px;
            }
            .home-title {
                font-size: 1.2rem;
            }
            .home-subtitle {
                font-size: 0.78rem;
            }
            .input-wrap input {
                padding: 12px 36px 12px 14px;
                font-size: 0.85rem;
            }
            .btn {
                padding: 12px 22px;
                font-size: 0.85rem;
            }
            .seat-detail-item {
                font-size: 1.3rem;
            }
            .error-message {
                height: 16px;
                line-height: 16px;
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-fixed"></div>

    <div class="app-container">
        <!-- 首页 -->
        <div class="page active" id="page-home">
            <div class="glass-card">
                <div class="home-icon">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="5" width="18" height="2.5" rx="1" />
                        <rect x="5.5" y="10" width="3.5" height="3.5" rx="0.8" />
                        <rect x="11" y="10" width="3.5" height="3.5" rx="0.8" />
                        <rect x="16.5" y="10" width="3.5" height="3.5" rx="0.8" />
                        <rect x="5.5" y="16" width="3.5" height="3.5" rx="0.8" />
                        <rect x="11" y="16" width="5" height="3.5" rx="0.8" fill="currentColor" stroke="none" opacity="0.35" />
                        <circle cx="13.5" cy="17.75" r="1" fill="#fff" />
                    </svg>
                </div>
                <h1 class="home-title">座位导航</h1>
                <p class="home-subtitle">输入姓名，查看您的座位</p>
                <div class="input-wrap">
                    <input type="text" id="nameInput" placeholder="请输入姓名" autocomplete="name" maxlength="30">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="8" r="4" /><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2" />
                    </svg>
                </div>
                <span class="error-message" id="errorMessage">请输入姓名</span>
                <button class="btn" id="btnFindSeat" type="button">查找座位</button>
            </div>
        </div>

        <!-- 结果页 -->
        <div class="page hidden" id="page-result">
            <div class="glass-card">
                <div class="result-header">
                    <div class="result-greeting">👋 <span class="name-em" id="displayName">---</span> 的座位</div>
                    <button class="btn btn-outline-sm" id="btnBack" type="button">← 返回</button>
                </div>
                <div class="seat-big-info" id="seatBigInfo"></div>
                <button class="btn btn-map" id="btnOpenMap" type="button">
                    查看全局座位图
                </button>
            </div>
        </div>

        <!-- 三级页面（全屏高清图） -->
        <div class="page hidden" id="page-map">
            <div class="image-fullscreen" id="imageFullscreen">
                <div class="image-top-bar">
                    <span style="color:#fff; font-weight:600; font-size:3.5vw;">会场座位示意图</span>
                    <button class="btn-image-back" id="btnImageBack" type="button">← 返回</button>
                </div>
                <div class="image-viewer-container" id="imageViewerContainer">
                    <!-- ★ 将 src 替换为你自己的高清座位图地址 ★ -->
                    <img id="seatImage" src="https://placehold.co/2000x1500/2c1a4a/f0eaff?text=座位示意图.png" alt="会场座位示意图">
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const pageHome = document.getElementById('page-home');
            const pageResult = document.getElementById('page-result');
            const pageMap = document.getElementById('page-map');
            const nameInput = document.getElementById('nameInput');
            const btnFindSeat = document.getElementById('btnFindSeat');
            const btnBack = document.getElementById('btnBack');
            const btnOpenMap = document.getElementById('btnOpenMap');
            const btnImageBack = document.getElementById('btnImageBack');
            const displayName = document.getElementById('displayName');
            const seatBigInfo = document.getElementById('seatBigInfo');
            const errorMessage = document.getElementById('errorMessage');
            const seatImage = document.getElementById('seatImage');
            const imageViewerContainer = document.getElementById('imageViewerContainer');

            // 座位数据
            const allSeats = [];
            for (let row = 1; row <= 13; row++) {
                let section = row <= 4 ? 'front' : row <= 9 ? 'middle' : 'back';
                for (let seat = 1; seat <= 10; seat++) {
                    allSeats.push({ zoneLetter: 'A', row, seat, section, code: `A${row}-${seat}` });
                    allSeats.push({ zoneLetter: 'B', row, seat, section, code: `B${row}-${seat}` });
                }
            }

            function hashString(str) {
                let h = 5381;
                for (let i = 0; i < str.length; i++) h = ((h << 5) + h) + str.charCodeAt(i) & 0x7fffffff;
                return h;
            }

            function getSeatByName(name) {
                const t = name.trim();
                if (!t) return null;
                return allSeats[hashString(t) % allSeats.length];
            }

            // 图片缩放拖动状态
            let imgScale = 1,
                imgOffX = 0,
                imgOffY = 0;
            const IMG_MIN = 0.5,
                IMG_MAX = 5;
            let lastPinch = 0,
                lastTx = 0,
                lastTy = 0,
                dragging = false;
            let baseOffsetX = 0,
                baseOffsetY = 0; // 居中基准偏移
            let isImageReady = false;

            function updateImageTransform() {
                if (!isImageReady) return;
                seatImage.style.transform = `translate(${imgOffX}px, ${imgOffY}px) scale(${imgScale})`;
            }

            // 计算图片居中位置作为基准偏移
            function calcCenterOffset() {
                const containerW = imageViewerContainer.clientWidth;
                const containerH = imageViewerContainer.clientHeight;
                const imgW = seatImage.naturalWidth || seatImage.width;
                const imgH = seatImage.naturalHeight || seatImage.height;

                if (!imgW || !imgH || !containerW || !containerH) return;

                const imgAspect = imgW / imgH;
                const containerAspect = containerW / containerH;
                let displayW, displayH;

                if (containerAspect > imgAspect) {
                    displayH = containerH;
                    displayW = displayH * imgAspect;
                } else {
                    displayW = containerW;
                    displayH = displayW / imgAspect;
                }

                // 设置图片显示尺寸
                seatImage.style.width = displayW + 'px';
                seatImage.style.height = displayH + 'px';

                // 居中偏移
                baseOffsetX = (containerW - displayW) / 2;
                baseOffsetY = (containerH - displayH) / 2;
                imgOffX = baseOffsetX;
                imgOffY = baseOffsetY;
                imgScale = 1;
                isImageReady = true;
                updateImageTransform();
            }

            function resetImage() {
                if (isImageReady) {
                    imgScale = 1;
                    imgOffX = baseOffsetX;
                    imgOffY = baseOffsetY;
                    updateImageTransform();
                } else {
                    // 图片还没准备好，等加载完再处理
                    imgScale = 1;
                    imgOffX = 0;
                    imgOffY = 0;
                }
            }

            // 图片加载完成后计算居中位置
            seatImage.addEventListener('load', function() {
                if (!pageMap.classList.contains('hidden')) {
                    calcCenterOffset();
                }
            });

            // 如果图片已缓存（load事件已触发），手动调用
            if (seatImage.complete && seatImage.naturalWidth) {
                // 页面初次加载时可能还没显示，延迟处理
            }

            function pinchDist(t1, t2) {
                return Math.sqrt((t1.clientX - t2.clientX) ** 2 + (t1.clientY - t2.clientY) ** 2);
            }

            imageViewerContainer.addEventListener('touchstart', function(e) {
                if (!isImageReady) return;
                e.preventDefault();
                if (e.touches.length === 2) {
                    dragging = false;
                    lastPinch = pinchDist(e.touches[0], e.touches[1]);
                } else if (e.touches.length === 1) {
                    dragging = true;
                    lastTx = e.touches[0].clientX;
                    lastTy = e.touches[0].clientY;
                }
            }, { passive: false });

            imageViewerContainer.addEventListener('touchmove', function(e) {
                if (!isImageReady) return;
                e.preventDefault();
                if (e.touches.length === 2) {
                    dragging = false;
                    const nd = pinchDist(e.touches[0], e.touches[1]);
                    const rect = imageViewerContainer.getBoundingClientRect();
                    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
                    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
                    if (lastPinch > 0) {
                        const r = nd / lastPinch;
                        const ns = Math.min(IMG_MAX, Math.max(IMG_MIN, imgScale * r));
                        // 以手势中心为原点缩放
                        imgOffX = cx - (cx - imgOffX) * (ns / imgScale);
                        imgOffY = cy - (cy - imgOffY) * (ns / imgScale);
                        imgScale = ns;
                        updateImageTransform();
                    }
                    lastPinch = nd;
                } else if (e.touches.length === 1 && dragging) {
                    imgOffX += e.touches[0].clientX - lastTx;
                    imgOffY += e.touches[0].clientY - lastTy;
                    lastTx = e.touches[0].clientX;
                    lastTy = e.touches[0].clientY;
                    updateImageTransform();
                }
            }, { passive: false });

            imageViewerContainer.addEventListener('touchend', function(e) {
                if (e.touches.length === 0) {
                    dragging = false;
                    lastPinch = 0;
                }
            });

            imageViewerContainer.addEventListener('wheel', function(e) {
                if (!isImageReady) return;
                e.preventDefault();
                const rect = imageViewerContainer.getBoundingClientRect();
                const mx = e.clientX - rect.left,
                    my = e.clientY - rect.top;
                const ns = Math.min(IMG_MAX, Math.max(IMG_MIN, imgScale * (e.deltaY > 0 ? 0.9 : 1.1)));
                imgOffX = mx - (mx - imgOffX) * (ns / imgScale);
                imgOffY = my - (my - imgOffY) * (ns / imgScale);
                imgScale = ns;
                updateImageTransform();
            }, { passive: false });

            // UI 逻辑
            let savedSeat = null;

            function showPage(page) {
                [pageHome, pageResult, pageMap].forEach(p => p.classList.add('hidden'));
                page.classList.remove('hidden');
            }

            function buildBigInfoHTML(seat) {
                const sc = seat.section;
                const st = sc === 'front' ? '前排' : sc === 'middle' ? '中排' : '后排';
                return `<div class="seat-zone-display"><span class="zone-badge ${sc}">${seat.zoneLetter}</span><span class="zone-text">${seat.zoneLetter}区 · ${st}</span></div><div class="seat-detail-row"><span class="seat-detail-item">第 ${seat.row} 排</span><span class="seat-detail-divider">·</span><span class="seat-detail-item">第 ${seat.seat} 座</span></div><span class="seat-code">🏷️ 编号：${seat.code}</span>`;
            }

            function showError(msg) {
                errorMessage.textContent = msg;
                errorMessage.classList.add('show');
                nameInput.style.borderColor = 'rgba(255,138,138,0.9)';
                setTimeout(() => {
                    errorMessage.classList.remove('show');
                    nameInput.style.borderColor = 'rgba(255,255,255,0.35)';
                }, 2000);
            }

            btnFindSeat.addEventListener('click', () => {
                const name = nameInput.value.trim();
                if (!name) { showError('请输入姓名'); return; }
                const seat = getSeatByName(name);
                if (!seat) { showError('未找到对应座位，请重试'); return; }
                savedSeat = seat;
                displayName.textContent = name.trim();
                seatBigInfo.innerHTML = buildBigInfoHTML(seat);
                showPage(pageResult);
                const url = new URL(window.location);
                url.searchParams.set('name', name.trim());
                history.pushState(null, '', url.toString());
            });
            nameInput.addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault();
                    btnFindSeat.click(); }
            });
            btnBack.addEventListener('click', () => {
                showPage(pageHome);
                nameInput.focus();
                if (window.location.search.includes('name=')) history.pushState(null, '', window.location
            .pathname);
            });

            btnOpenMap.addEventListener('click', () => {
                showPage(pageMap);
                isImageReady = false;
                // 重新计算居中位置（容器尺寸可能已变化）
                if (seatImage.complete && seatImage.naturalWidth) {
                    setTimeout(calcCenterOffset, 80);
                } else {
                    // 等待load事件
                    imgScale = 1;
                    imgOffX = 0;
                    imgOffY = 0;
                }
            });

            btnImageBack.addEventListener('click', () => {
                showPage(pageResult);
            });

            window.addEventListener('popstate', () => {
                const params = new URLSearchParams(window.location.search);
                const nameParam = params.get('name');
                if (nameParam && nameParam.trim()) {
                    const seat = getSeatByName(nameParam);
                    if (seat) {
                        savedSeat = seat;
                        displayName.textContent = nameParam.trim();
                        seatBigInfo.innerHTML = buildBigInfoHTML(seat);
                        showPage(pageResult);
                        return;
                    }
                }
                showPage(pageHome);
                nameInput.focus();
            });

            // 窗口大小变化时重新计算图片居中位置
            window.addEventListener('resize', () => {
                if (pageMap.classList.contains('active') && seatImage.complete && seatImage.naturalWidth) {
                    calcCenterOffset();
                }
            });

            function init() {
                const params = new URLSearchParams(window.location.search);
                const nameParam = params.get('name');
                if (nameParam && nameParam.trim()) {
                    const seat = getSeatByName(nameParam);
                    if (seat) {
                        savedSeat = seat;
                        displayName.textContent = nameParam.trim();
                        seatBigInfo.innerHTML = buildBigInfoHTML(seat);
                        showPage(pageResult);
                        return;
                    }
                }
                showPage(pageHome);
                nameInput.focus();
            }
            init();
        })();
    </script>
</body>
</html>
